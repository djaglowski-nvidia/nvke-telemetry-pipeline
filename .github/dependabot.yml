version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /tests
      - /nvcb/tests
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Released in lockstep, so a failed bump should not block the rest.
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      go-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - k8s.io/*
          - sigs.k8s.io/*
