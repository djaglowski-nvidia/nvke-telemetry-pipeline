suite: crds
includeCrds: true
release:
  name: test
templates:
  - charts/opentelemetry-kube-stack/charts/*-crds/crds/*.yaml
tests:
  - it: includes only the four OpenTelemetry and four monitoring CRDs
    asserts: &native_crds
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: opentelemetrycollectors.opentelemetry.io
        template: charts/opentelemetry-kube-stack/charts/otel-crds/crds/opentelemetry.io_opentelemetrycollectors.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: instrumentations.opentelemetry.io
        template: charts/opentelemetry-kube-stack/charts/otel-crds/crds/opentelemetry.io_instrumentations.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: targetallocators.opentelemetry.io
        template: charts/opentelemetry-kube-stack/charts/otel-crds/crds/opentelemetry.io_targetallocators.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: opampbridges.opentelemetry.io
        template: charts/opentelemetry-kube-stack/charts/otel-crds/crds/opentelemetry.io_opampbridges.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: servicemonitors.monitoring.coreos.com
        template: charts/opentelemetry-kube-stack/charts/prometheus-crds/crds/monitoring.coreos.com_servicemonitors.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: podmonitors.monitoring.coreos.com
        template: charts/opentelemetry-kube-stack/charts/prometheus-crds/crds/monitoring.coreos.com_podmonitors.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: probes.monitoring.coreos.com
        template: charts/opentelemetry-kube-stack/charts/prometheus-crds/crds/monitoring.coreos.com_probes.yaml
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: scrapeconfigs.monitoring.coreos.com
        template: charts/opentelemetry-kube-stack/charts/prometheus-crds/crds/monitoring.coreos.com_scrapeconfigs.yaml
      - matchRegex:
          path: spec.names.kind
          pattern: '^(OpenTelemetryCollector|Instrumentation|TargetAllocator|OpAMPBridge|ServiceMonitor|PodMonitor|Probe|ScrapeConfig)$'

  - it: disables OpenTelemetry CRDs without disabling monitoring CRDs
    set:
      opentelemetry-kube-stack.crds.installOtel: false
    asserts:
      - notMatchRegex:
          path: spec.group
          pattern: '^opentelemetry[.]io$'
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: servicemonitors.monitoring.coreos.com
        template: charts/opentelemetry-kube-stack/charts/prometheus-crds/crds/monitoring.coreos.com_servicemonitors.yaml

  - it: disables monitoring CRDs without disabling OpenTelemetry CRDs
    set:
      opentelemetry-kube-stack.crds.installPrometheus: false
    asserts:
      - notMatchRegex:
          path: spec.group
          pattern: '^monitoring[.]coreos[.]com$'
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          name: opentelemetrycollectors.opentelemetry.io
        template: charts/opentelemetry-kube-stack/charts/otel-crds/crds/opentelemetry.io_opentelemetrycollectors.yaml

  - it: omits all native CRDs when both installation flags are disabled
    set:
      opentelemetry-kube-stack.crds.installOtel: false
      opentelemetry-kube-stack.crds.installPrometheus: false
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps native CRD installation independent of the operator
    set:
      opentelemetry-kube-stack.opentelemetry-operator.enabled: false
    asserts: *native_crds
