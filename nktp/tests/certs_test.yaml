suite: internal TLS certificates
release:
  name: nktp
  namespace: nktp
templates:
  - templates/certs.yaml
tests:
  - it: creates the internal CA and all collector leaf certificates by default
    asserts:
      - hasDocuments:
          count: 13
      - equal:
          path: spec.selfSigned
          value: {}
        documentSelector:
          path: metadata.name
          value: nktp-internal-selfsigned-issuer
      - equal:
          path: spec
          value:
            secretName: nktp-internal-ca
            commonName: nktp-internal-ca
            duration: 43800h
            renewBefore: 8760h
            isCA: true
            usages: [cert sign]
            privateKey:
              rotationPolicy: Never
            issuerRef:
              name: nktp-internal-selfsigned-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-internal-ca
      - equal:
          path: spec.ca.secretName
          value: nktp-internal-ca
        documentSelector:
          path: metadata.name
          value: nktp-internal-ca-issuer
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-watchdog-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-server, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-daemonset-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-large-target-metrics-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-cluster-events-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-logs-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-metrics-client, any: true}
      - containsDocument: {apiVersion: cert-manager.io/v1, kind: Certificate, name: nktp-gateway-traces-client, any: true}
      - equal:
          path: spec
          value:
            secretName: nktp-watchdog-server-tls
            duration: 2160h
            renewBefore: 360h
            dnsNames:
              - nktp-watchdog-collector
              - nktp-watchdog-collector.nktp
              - nktp-watchdog-collector.nktp.svc
              - nktp-watchdog-collector.nktp.svc.cluster.local
            usages: [server auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-watchdog-server
      - equal:
          path: spec
          value:
            secretName: nktp-daemonset-client-tls
            commonName: nktp-daemonset
            duration: 2160h
            renewBefore: 360h
            usages: [client auth]
            privateKey:
              rotationPolicy: Always
            issuerRef:
              name: nktp-internal-ca-issuer
              kind: Issuer
              group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-daemonset-client

  - it: uses the configured external issuer for all leaf certificates
    set:
      tls.internal.certManager.issuerRef:
        name: corporate-workload-ca
        kind: ClusterIssuer
        group: cert-manager.io
    asserts:
      - hasDocuments:
          count: 10
      - containsDocument:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          any: true
        not: true
      - equal:
          path: spec.issuerRef
          value:
            name: corporate-workload-ca
            kind: ClusterIssuer
            group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-watchdog-server
      - equal:
          path: spec.issuerRef
          value:
            name: corporate-workload-ca
            kind: ClusterIssuer
            group: cert-manager.io
        documentSelector:
          path: metadata.name
          value: nktp-daemonset-client

  - it: creates no certificate resources when internal TLS is disabled
    set:
      tls.internal.enabled: false
    asserts:
      - hasDocuments:
          count: 0
