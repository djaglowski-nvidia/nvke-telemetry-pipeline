suite: CRD retention packaging
# Native crds/ files are installed separately and never enter Helm's release
# manifest. The crds suite checks their presence; this suite catches CRDs moved
# into templates/, where Helm would manage and delete them on uninstall.
includeCrds: false
templates:
  - '**/*.yaml'
tests:
  - it: excludes CRDs from the tracked install manifest
    asserts: &no_tracked_crds
      - containsDocument:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          any: true
        not: true

  - it: excludes CRDs from the tracked upgrade manifest
    release:
      upgrade: true
    asserts: *no_tracked_crds
