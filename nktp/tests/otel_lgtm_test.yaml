suite: otel-lgtm
templates:
  - templates/otel-lgtm.yaml
tests:
  - it: renders the backend by default
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: lgtm
          any: true
      - containsDocument:
          apiVersion: v1
          kind: Service
          name: lgtm
          any: true
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: lgtm-dashboards
          any: true
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: lgtm-dashboard-provider
          any: true

  - it: provisions the combined health dashboard with workload state and diagnostic signals
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"uid": "nktp-health"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_deployment_spec_replicas.*kube_statefulset_replicas.*kube_daemonset_status_desired_number_scheduled'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'opentelemetry_allocator_targets_per_collector'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'controller_runtime_reconcile_errors_total'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_state_metrics_watch_total'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"type": "logs"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"queryType": "traceql"'

  - it: searches diagnostic log text without interpreting user input as LogQL or regex
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'contains \(lower \(urldecode \\"\$\{search:percentencode\}\\"\)\) \(lower \(__line__\)\)'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '__nktp_search_match=\\"true\\" \| drop __nktp_search_match'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: '\$\{search:regex\}|\| line_format'

  - it: preserves unknown health and bounds per-target health detail
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"noValue": "Unknown"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'and \(count\('
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'max\(100 \* otelcol_exporter_queue_size.* / otelcol_exporter_queue_capacity'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"byField": "target"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'topk\(20,.*@ end\(\)'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'or vector\(0\)|targets_unassigned|timestamp\('

  - it: shows measured export delays and KSM object scrape growth
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'otelcol_exporter_in_flight_requests'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: '"metricsQueryType": "range"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'max_over_time\(duration\) by \(resource.service.name, span:name\)'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'exporter/enqueue'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'delta\(\(scrape_samples_scraped.*endpoint=\\"http-metrics\\".*up.*== 1'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'rate\(scrape_samples|scrape_body_size_bytes|scrape_timeout_seconds|scrape_sample_limit|"step": "\$__interval"'

  - it: shows collected container budgets without unavailable usage columns
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_pod_container_info'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'Container CPU budgets'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'Container memory budgets'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_pod_container_resource_requests.*kube_pod_container_resource_limits'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'and on \(namespace, pod, container\)'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'topk by \(component\) \(3,'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|0 / 0|"match": "nan"|"Usage"|"Request use"|"Limit use"'

  - it: shows allocation means and measured KSM and node-exporter diagnostics
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'opentelemetry_allocator_time_to_allocate_sum.* / .*opentelemetry_allocator_time_to_allocate_count.* > 0'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'opentelemetry_allocator_time_to_allocate_bucket'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_state_metrics_list_total'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'count by \(job, shard_ordinal\).*kube_state_metrics_shard_ordinal.*job!=\\"\$namespace/nktp-ksm-pods\\"'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'kube_state_metrics_total_shards'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'node_scrape_collector_success'
      - matchRegex:
          path: data["nktp-health.json"]
          pattern: 'node_scrape_collector_duration_seconds'
      - notMatchRegex:
          path: data["nktp-health.json"]
          pattern: 'rate\(node_scrape_collector_(success|duration)'

  - it: provisions the operator dashboard
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: '"uid": "nktp-operator"'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: '"title": "NKTP Operator"'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: '"title": "Reporting replicas"'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: 'count\(count by \(instance\) \(process_start_time_seconds'
      - notMatchRegex:
          path: data["nktp-operator.json"]
          pattern: 'up\{|opentelemetry_allocator'
      - matchRegex:
          path: data["nktp-watchdog.json"]
          pattern: 'sum\(up\{job=\\"nktp-operator\\"\}\)'
      - notMatchRegex:
          path: data["nktp-watchdog.json"]
          pattern: 'timestamp\(|metric age|Reporting Operator / allocator'
      - matchRegex:
          path: data["nktp-watchdog.json"]
          pattern: opentelemetry_allocator_targets_per_collector

  - it: includes every operator pod and retains per-pod event and latency series
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - notMatchRegex:
          path: data["nktp-operator.json"]
          pattern: '"name": "instance"|\$instance|instance=~'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: 'sum by \(pod, controller, result\) \(increase\(controller_runtime_reconcile_total'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: '"stacking": \{ "mode": "normal", "group": "reconciliations" \}'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: 'sum by \(le, pod, controller\)'
      - matchRegex:
          path: data["nktp-operator.json"]
          pattern: 'sum by \(le, pod, webhook\)'

  - it: provisions the logs gateway dashboard
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-gateway-logs.json"]
          pattern: '"uid": "nktp-gateway-logs"'
      - matchRegex:
          path: data["nktp-gateway-logs.json"]
          pattern: '"title": "NKTP Logs Gateway"'
      - matchRegex:
          path: data["nktp-gateway-logs.json"]
          pattern: otelcol_receiver_accepted_log_records_total
      - notMatchRegex:
          path: data["nktp-gateway-logs.json"]
          pattern: 'opentelemetry_allocator|metric_points|accepted_spans|sent_spans'

  - it: provisions the metrics gateway dashboard
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-gateway-metrics.json"]
          pattern: '"uid": "nktp-gateway-metrics"'
      - matchRegex:
          path: data["nktp-gateway-metrics.json"]
          pattern: '"title": "NKTP Metrics Gateway"'
      - matchRegex:
          path: data["nktp-gateway-metrics.json"]
          pattern: otelcol_receiver_accepted_metric_points_total
      - notMatchRegex:
          path: data["nktp-gateway-metrics.json"]
          pattern: 'opentelemetry_allocator|log_records|accepted_spans|sent_spans'

  - it: provisions the traces gateway dashboard
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-gateway-traces.json"]
          pattern: '"uid": "nktp-gateway-traces"'
      - matchRegex:
          path: data["nktp-gateway-traces.json"]
          pattern: '"title": "NKTP Traces Gateway"'
      - matchRegex:
          path: data["nktp-gateway-traces.json"]
          pattern: otelcol_receiver_accepted_spans_total
      - notMatchRegex:
          path: data["nktp-gateway-traces.json"]
          pattern: 'opentelemetry_allocator|metric_points|log_records'

  - it: provisions cluster event activity and leadership logs without requiring scraped metrics
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: '"uid": "nktp-cluster-events"'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: '"title": "NKTP Cluster Events"'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'sum by \(instance\) \(increase\(otelcol_receiver_accepted_log_records_total'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'sum by \(instance\) \(increase\(otelcol_exporter_sent_log_records_total'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'sum by \(instance, exporter\) \(otelcol_exporter_queue_size'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'max by \(instance\) \(otelcol_process_memory_rss_bytes'
      - matchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'Events Receiver started as leader\|no longer leader, stopping'
      - notMatchRegex:
          path: data["nktp-cluster-events.json"]
          pattern: 'opentelemetry_allocator|leader_election_master_status|\$instance'

  - it: provisions large-target metrics and Target Allocator health
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: '"uid": "nktp-large-target-metrics"'
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: otelcol_receiver_accepted_metric_points_total
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: opentelemetry_allocator_collectors_allocatable
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: opentelemetry_allocator_targets_per_collector

  - it: shows current large-target scrape samples and matched durations
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: '"type": "histogram",\s+"title": "Samples per scrape"'
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: 'scrape_samples_scraped\{nktp_metrics_pool=\\"large-target\\",job!=\\"nktp-large-target-metrics-targetallocator\\"\}'
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: 'scrape_duration_seconds.*and on \(job, instance\) topk\(20,'
      - matchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: '"instant": true,\s+"range": false,\s+"format": "table"'
      - notMatchRegex:
          path: data["nktp-large-target-metrics.json"]
          pattern: 'scrape_body_size_bytes|rate\(scrape_samples_scraped'

  - it: removes all otel-lgtm resources when disabled
    set:
      otel-lgtm:
        enabled: false
    asserts:
      - containsDocument:
          apiVersion: apps/v1
          kind: Deployment
          name: lgtm
        not: true
      - containsDocument:
          apiVersion: v1
          kind: Service
          name: lgtm
        not: true
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: lgtm-dashboards
        not: true
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: lgtm-dashboard-provider
        not: true

  - it: pins the backend image
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: grafana/otel-lgtm:0.32.0

  - it: sets a custom image
    set:
      otel-lgtm:
        image: {registry: "", repository: grafana/otel-lgtm, tag: 0.31.0}
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: grafana/otel-lgtm:0.31.0

  - it: enables anonymous admin access to Grafana
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_ANONYMOUS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GF_AUTH_ANONYMOUS_ORG_ROLE
            value: Admin

  - it: converts delta counters pushed by Target Allocators at the backend
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMETHEUS_EXTRA_ARGS
            value: --enable-feature=otlp-deltatocumulative

  - it: exposes Prometheus, Grafana and OTLP ports
    documentSelector:
      path: spec.selector
      value:
        app: lgtm
    asserts:
      - contains:
          path: spec.ports
          content:
            name: prometheus
            protocol: TCP
            port: 9090
            targetPort: 9090
      - contains:
          path: spec.ports
          content:
            name: grafana
            protocol: TCP
            port: 3000
            targetPort: 3000
      - contains:
          path: spec.ports
          content:
            name: otel-grpc
            protocol: TCP
            port: 4317
            targetPort: 4317
      - contains:
          path: spec.ports
          content:
            name: otel-http
            protocol: TCP
            port: 4318
            targetPort: 4318

  - it: rolls the pod when dashboard config changes
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/dashboards"]

  - it: provisions the DaemonSet and Target Allocator dashboard
    documentSelector:
      path: metadata.name
      value: lgtm-dashboards
    asserts:
      - matchRegex:
          path: data["nktp-daemonset.json"]
          pattern: '"title": "NKTP DaemonSet"'
      - matchRegex:
          path: data["nktp-daemonset.json"]
          pattern: otelcol_receiver_accepted_metric_points_total
      - matchRegex:
          path: data["nktp-daemonset.json"]
          pattern: otelcol_receiver_accepted_log_records_total
      - matchRegex:
          path: data["nktp-daemonset.json"]
          pattern: opentelemetry_allocator_targets_unassigned
      - matchRegex:
          path: data["nktp-daemonset.json"]
          pattern: opentelemetry_allocator_targets_per_collector

  - it: uses the bundled Prometheus configuration
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: prometheus-config
            mountPath: /otel-lgtm/prometheus.yaml
            subPath: prometheus.yaml
      - notExists:
          path: spec.template.metadata.annotations["checksum/prometheus"]

  - it: removes all dashboard and backend resources when LGTM is disabled
    set:
      otel-lgtm.enabled: false
    asserts:
      - hasDocuments:
          count: 0
