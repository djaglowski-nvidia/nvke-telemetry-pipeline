# Default values for the NKTP Helm chart.

# Namespace for all namespaced NKTP resources. Created by the chart when
# create is true. CRDs and other cluster-scoped resources are unaffected.
namespace:
  name: nktp
  create: true

# Collector image used by all OTel workloads, in the same form as
# OpenTelemetryCollector spec.image (repo:tag or repo@digest).
otelcol_image: otel/opentelemetry-collector-k8s:0.159.0

# OTel workloads. Each workload uses the same structure:
#   kubernetes:     Standard Kubernetes settings (resources, affinity, selectors, labels, ...).
#   otelcol.image:  Set a custom image for this workload only.
#   otelcol.config: Native OTel collector configuration.

# Receives internal telemetry from all NKTP collectors.
watchdog:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Log gateway. Exports all logs from the cluster.
gateway_logs:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Metric gateway. Exports all metrics from the cluster.
gateway_metrics:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Trace gateway. Exports all traces from the cluster.
gateway_traces:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Node-level collector. Ingests OTLP from local pods, reads local logs, and collects host metrics.
daemonset:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Cluster-level scraper pool.
cluster_metrics:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Cluster singleton. Collects Kubernetes API server events.
cluster_events:
  kubernetes: {}
  otelcol:
    # Set a custom image for this workload only.
    # image: otel/opentelemetry-collector-k8s:0.159.0
    config: {}

# Default in-cluster backend. MUST be disabled for production use.
otel-lgtm:
  enabled: true
  image: grafana/otel-lgtm:0.32.0

# Configuration below this point is inherited from bundled charts. Each
# chart has an install or enabled flag, and further configuration passes
# through under its key using the chart's own conventions.

# Provides the Operator and native OpenTelemetry and Prometheus CRDs.
opentelemetry-kube-stack:
  crds:
    installOtel: true
    installPrometheus: true
  collectors:
    daemon:
      enabled: false
  clusterRole:
    enabled: false
  opentelemetry-operator:
    fullnameOverride: nktp-operator
    admissionWebhooks:
      certManager:
        # Enable this to use an existing cert-manager installation.
        enabled: false
      autoGenerateCert:
        recreate: false

# Kubernetes object state metrics. Sharded for scalability.
kube-state-metrics:
  enabled: true

# Host-level metrics from each node. Runs as a DaemonSet with host networking,
# so it binds port 9100 on every node.
node-exporter:
  enabled: true
  prometheus:
    monitor:
      # Declares the exporter as a scrape target, ready for a collector to pick up.
      enabled: true

# Resource metrics API, used for autoscaling. Disabled by default because it is installed
# via other mechanisms in many clusters.
metrics-server:
  enabled: false
