apiVersion: v2
name: nktp
description: A scalable, OpenTelemetry pipeline for collecting, processing, and exporting Kubernetes metrics, logs, and traces.
type: application
version: 0.1.0

dependencies:
  - name: opentelemetry-kube-stack
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.22.0
  - name: prometheus-node-exporter
    alias: node-exporter
    repository: https://prometheus-community.github.io/helm-charts
    version: 4.56.1
    condition: node-exporter.enabled
