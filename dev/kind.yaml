kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
        etcd:
          local:
            extraArgs:
              listen-metrics-urls: http://0.0.0.0:2381
      - |
        kind: KubeProxyConfiguration
        metricsBindAddress: 0.0.0.0:10249
      # Pull images in parallel so small images do not wait behind large ones.
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
# Read registry mirror settings from certs.d. registry-mirrors.sh writes them.
# Containerd can pull through the CRI image service or the transfer service.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
    [plugins."io.containerd.transfer.v1.local"]
      config_path = "/etc/containerd/certs.d"
