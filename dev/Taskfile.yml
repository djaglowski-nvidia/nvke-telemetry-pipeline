version: '3'

# Every command that talks to a cluster is explicitly pointed at .kubeconfig,
# a file dedicated to this project's Kind cluster. The dev loop never reads or
# writes any other kubeconfig, regardless of the user's environment.

vars:
  # Taskfile env cannot override an inherited PATH, so commands set it inline.
  TOOLS_PATH: 'PATH={{.TASKFILE_DIR | shellQuote}}/.bin:"$PATH"'

tasks:

  # --- Dev-facing tasks ---

  up:
    desc: 'Start the Tilt dev loop against the local Kind cluster (config: task dev:up -- <name>)'
    deps: [cluster:up]
    silent: true
    cmds:
      - task: stop-tilt
      - echo "Starting Tilt..."
      - '{{.TOOLS_PATH}} sh -c ''KUBECONFIG=$(pwd)/.kubeconfig tilt up --context kind-nktp {{if .CLI_ARGS}}-- --config {{.CLI_ARGS}}{{end}} > .tilt.log 2>&1 & echo $! > .tilt.pid'''
      - |
        export {{.TOOLS_PATH}}
        status=0
        bash wait-ready.sh || status=$?
        echo ""
        echo "  Config:     Kind host paths{{if .CLI_ARGS}} + dev/configs/{{.CLI_ARGS}}{{end}}"
        echo "  kubectl access: export KUBECONFIG=$(pwd)/.kubeconfig"
        echo "  Logs: dev/.tilt.log   Stop: task dev:down"
        echo ""
        if [ "$status" -ne 0 ]; then
          echo "  Startup incomplete. UIs may not be available yet."
        fi
        echo "  Tilt UI:    http://localhost:10350"
        echo ""
        exit "$status"

  down:
    desc: Stop the dev loop and delete the local Kind cluster
    silent: true
    cmds:
      - task: stop-tilt
      - task: cluster:down

  # --- Internal tasks ---

  stop-tilt:
    internal: true
    desc: Stop the Tilt session if one is running
    silent: true
    cmds:
      # Task's embedded shell does not implement kill, so use a real shell.
      # Wait for Tilt to exit so its replacement can bind the same ports.
      # Match the executable basename because ps may include its full path.
      - |
        sh -c '
          if test -f .tilt.pid && ps -p "$(cat .tilt.pid)" -o comm= | grep -Eq "(^|/)tilt$"; then
            pid=$(cat .tilt.pid)
            kill "$pid" 2>/dev/null || true
            for attempt in 1 2 3 4 5; do
              ps -p "$pid" -o comm= | grep -Eq "(^|/)tilt$" || exit 0
              sleep 1
            done
            echo "Tilt did not stop; retaining its PID and log." >&2
            exit 1
          fi
        '
      - rm -f .tilt.pid .tilt.log .grafana-forward.log

  cluster:up:
    internal: true
    desc: Create the local Kind cluster
    deps: [tools]
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: 'Docker daemon is not running. Start it (e.g. colima start, or Docker Desktop) and retry.'
    silent: true
    cmds:
      # NODE_IMAGE comes from the root Taskfile, so every cluster in the
      # repository runs one Kubernetes version rather than whichever one the
      # installed kind binary happens to default to.
      - echo "Preparing the local Kind cluster..."
      - |
        export {{.TOOLS_PATH}}
        if ! kind get clusters | grep -qx nktp; then
          kind create cluster --name nktp --image {{.NODE_IMAGE}} --kubeconfig .kubeconfig --config kind.yaml
          if test -f .images.tar; then
            echo "Restoring cached images into Kind..."
            if ! kind load image-archive --name nktp .images.tar; then
              echo "Could not restore the image cache. Continuing startup with normal image pulls." >&2
            fi
          fi
        fi
      - '{{.TOOLS_PATH}} kind -q export kubeconfig --name nktp --kubeconfig .kubeconfig'
      - echo "Waiting for Kind nodes to become ready..."
      - '{{.TOOLS_PATH}} kubectl wait --kubeconfig .kubeconfig --context kind-nktp --for=condition=Ready nodes --all --timeout=5m'
      - task: :cert-manager:install
        vars:
          KUBECONFIG_FILE: '{{.TASKFILE_DIR}}/.kubeconfig'
          KUBE_CONTEXT: kind-nktp
          TOOLS_PATH: '{{.TOOLS_PATH}}'

  cluster:down:
    internal: true
    desc: Delete the local Kind cluster
    silent: true
    cmds:
      - |
        export {{.TOOLS_PATH}}
        if kind get clusters | grep -qx nktp; then
          echo "Saving Kind images for the next startup..."
          if docker exec nktp-control-plane sh -ec '
            cached_images=$(ctr -n k8s.io images list -q)
            # Keep only the node platform so Kind can load the complete archive.
            for image in $cached_images; do
              ctr -n k8s.io images convert "$image" "$image" >/dev/null
            done
            ctr -n k8s.io images export --local - $cached_images
          ' > .images.tar.tmp; then
            mv .images.tar.tmp .images.tar
          else
            rm -f .images.tar.tmp
            echo "Could not refresh the image cache. Continuing shutdown with the previous cache." >&2
          fi
          kind delete cluster --name nktp --kubeconfig .kubeconfig
        else
          echo "Kind cluster is already stopped."
        fi
      - rm -f .kubeconfig

  tools:
    internal: true
    desc: Install the pinned kind, kubectl, helm, and tilt into dev/.bin
    silent: true
    cmds:
      - |
        missing=0
        for tool in docker curl tar; do
          command -v "$tool" >/dev/null || { echo "missing: $tool (see dev/README.md)"; missing=1; }
        done
        exit $missing
      - bash install-tools.sh
