# Select the kubeconfig through test:scale. Adjust namespace and endpoints as needed.
name: telemetrygen
timeout: 4m
stages:
  - name: load
    generators:
    - name: metrics
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - metrics
                  - --otlp-endpoint=nktp-gateway-metrics-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    - name: logs
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - logs
                  - --otlp-endpoint=nktp-gateway-logs-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    - name: traces
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - traces
                  - --otlp-endpoint=nktp-gateway-traces-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 3m
        interval: 15s
        query_timeout: 10s
        measurements:
          # Empty results are retained until this run's metrics reach the backend.
          - name: active_series
            units: series
            query: count({test_run_id="{{ .Args.runId }}"})
          # Collector self-metrics include all traffic through the service.
          - name: gateway_received_points_per_second
            units: points/s
            query: sum(rate(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          - name: gateway_sent_points_per_second
            units: points/s
            query: sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          # Queue size uses bytes with the current NKTP exporter configuration.
          - name: gateway_queue_bytes
            units: bytes
            query: sum by (instance, exporter) (otelcol_exporter_queue_size{job="nktp-gateway-metrics",data_type="metrics"})
          - name: watchdog_queue_bytes
            units: bytes
            query: sum by (instance, exporter, data_type) (otelcol_exporter_queue_size{job="nktp-watchdog"})
          - name: gateway_memory_bytes
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-gateway-metrics"}
          - name: gateway_memory_growth_bytes_per_second
            units: bytes/s
            query: deriv(otelcol_process_memory_rss_bytes{job="nktp-gateway-metrics"}[2m])
