# Select the kubeconfig through test:scale. Adjust namespace and endpoints as needed.
name: telemetrygen
execution: parallel
timeout: 4m
stages:
  - name: metrics
    generator:
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - metrics
                  - --otlp-endpoint=nktp-gateway-metrics-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 3m
        interval: 15s
        query_timeout: 10s
        units:
          active_series: series
          gateway_received_points_per_second: points/s
          gateway_sent_points_per_second: points/s
          gateway_queue_bytes: bytes
          watchdog_queue_bytes: bytes
          gateway_memory_bytes: bytes
          gateway_memory_growth_bytes_per_second: bytes/s
        queries:
          # Empty results are retained until this run's metrics reach the backend.
          active_series: 'count({test_run_id="{{ .Args.runId }}"})'
          # Collector self-metrics include all traffic through the service.
          gateway_received_points_per_second: 'sum(rate(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics"}[2m]))'
          gateway_sent_points_per_second: 'sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics"}[2m]))'
          # Queue size uses bytes with the current NKTP exporter configuration.
          gateway_queue_bytes: 'sum by (instance, exporter) (otelcol_exporter_queue_size{job="nktp-gateway-metrics",data_type="metrics"})'
          watchdog_queue_bytes: 'sum by (instance, exporter, data_type) (otelcol_exporter_queue_size{job="nktp-watchdog"})'
          gateway_memory_bytes: 'otelcol_process_memory_rss_bytes{job="nktp-gateway-metrics"}'
          gateway_memory_growth_bytes_per_second: 'deriv(otelcol_process_memory_rss_bytes{job="nktp-gateway-metrics"}[2m])'
  - name: logs
    generator:
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - logs
                  - --otlp-endpoint=nktp-gateway-logs-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    measurement:
      type: noop
      spec:
        queries:
          # LogQL assumes OTLP log attributes are stored as structured metadata.
          # service_name selects indexed streams before filtering the run.
          log_entries: '{service_name=~".+"} | test_run_id="{{ .Args.runId }}"'
  - name: traces
    generator:
      type: job
      spec:
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - traces
                  - --otlp-endpoint=nktp-gateway-traces-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=3m
                  - --rate=10
                  - --workers=1
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
    measurement:
      type: noop
      spec:
        queries:
          # TraceQL selects spans carrying this run's telemetry attribute.
          traces: '{ span.test_run_id = "{{ .Args.runId }}" }'
