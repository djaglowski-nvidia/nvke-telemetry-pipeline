name: kwok-nodes
timeout: 20m
stages:
  - name: nodes
    generators:
    - name: nodes
      type: kubernetes
      spec:
        duration: 10m
        nodeGroups:
          - name: workers
            replicas: 1000
            nodeTemplate:
              metadata:
                labels:
                  run_id: '{{ .Args.runId }}'
              status:
                capacity:
                  cpu: "96"
                  memory: 384Gi
                  pods: "110"
