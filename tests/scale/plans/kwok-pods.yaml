name: kwok-pods
timeout: 20m
stages:
- name: pods
  generators:
  - name: pods
    type: pod
    spec:
      count: 1000
      podTemplate:
        metadata:
          namespace: default
          labels:
            run_id: '{{ .Args.runId }}'
            scale.nktp.io/lifecycle: complete-30s
        spec:
          restartPolicy: Never
          nodeSelector:
            run_id: '{{ .Args.runId }}'
          tolerations:
          - key: kwok.x-k8s.io/node
            operator: Equal
            value: fake
            effect: NoSchedule
          containers:
          - name: load
            image: registry.k8s.io/pause:3.10
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
