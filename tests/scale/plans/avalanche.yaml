# Install the scrape profile from ../scale-test-values.yaml before running this plan.
name: avalanche
timeout: 4m
stages:
  - name: metrics
    generators:
    - name: metrics
      type: statefulset
      spec:
        replicas: 3
        duration: 3m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: avalanche
          spec:
            containers:
              - name: avalanche
                image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
                command: [/bin/avalanche]
                args:
                  - --port=9001
                  - --gauge-metric-count=100
                  - --series-count=100
                  - --series-interval=0
                  - --metric-interval=0
                  - --const-label=generator_instance=$(POD_NAME)
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                readinessProbe:
                  httpGet:
                    path: /metrics
                    port: 9001
