# 5,000 sources each send 100 metric points/minute and 100 logs/minute with 100 KiB bodies.
name: watchdog-5000
execution: parallel
timeout: 45m
stages:
  - name: node-collectors-1
    generator: &sources
      type: pod
      spec:
        replicas: 1000
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: watchdog-5000
              scale.nktp.io/run-id: '{{ .Args.runId }}'
          spec:
            restartPolicy: Never
            activeDeadlineSeconds: 2700
            terminationGracePeriodSeconds: 90
            automountServiceAccountToken: false
            nodeSelector:
              nodeGroup: customer-cpu
            tolerations:
              - key: skyhook.nvidia.com
                operator: Equal
                value: runtime-required
                effect: NoSchedule
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeAffinityPolicy: Honor
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    scale.nktp.io/workload: watchdog-5000
                    scale.nktp.io/run-id: '{{ .Args.runId }}'
            containers:
              - name: watchdog-node-metrics
                image: &telemetrygen ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - metrics
                  - --otlp-endpoint=nktp-watchdog-collector.nktp.svc:4318
                  - --otlp-http
                  - --otlp-insecure
                  - --duration=30m
                  - --workers=1
                  - --rate=1.6666666666666667
                  - --batch
                  - --batch-size=100
                  - --metric-type=Gauge
                  - --unique-timeseries=false
                  - --otlp-metric-name=nktp_watchdog_load
                  - --service=nktp-watchdog-load-node
                  - '--otlp-attributes=service.instance.id="$(POD_UID)"'
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
                  - '--telemetry-attributes=generator_instance="$(POD_NAME)"'
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
              - name: watchdog-node-logs
                image: *telemetrygen
                command: [/telemetrygen]
                args:
                  - logs
                  - --otlp-endpoint=nktp-watchdog-collector.nktp.svc:4318
                  - --otlp-http
                  - --otlp-insecure
                  - --duration=30m
                  - --workers=1
                  - --rate=1.6666666666666667
                  - --batch
                  - --batch-size=10
                  - --body=$(LOG_BODY)
                  - --service=nktp-watchdog-load-node
                  - '--otlp-attributes=service.instance.id="$(POD_UID)"'
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
                  - '--telemetry-attributes=generator_instance="$(POD_NAME)"'
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
                  - name: OTEL_EXPORTER_OTLP_LOGS_COMPRESSION
                    value: gzip
                  - name: LOG_BODY
                    valueFrom:
                      configMapKeyRef:
                        name: nktp-watchdog-load
                        key: log-body
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 40m
        interval: 30s
        query_timeout: 20s
        units:
          fresh_sources: sources
          delivered_metric_age: seconds
          producer_ready: containers
          producer_restarts: restarts
          watchdog_cpu: cores
          watchdog_rss: bytes
          watchdog_heap: bytes
          watchdog_queue: bytes
          watchdog_inflight: requests
          watchdog_queue_capacity: bytes
          watchdog_self_metric_age: seconds
          watchdog_restarts: restarts
          watchdog_hpa_replicas: replicas
          blackhole_cpu: cores
          blackhole_rss: bytes
          blackhole_self_metric_age: seconds
          blackhole_accepted_logs: records/s
          blackhole_refused_logs: records/s
          blackhole_restarts: restarts
          accepted_metrics: points/s
          accepted_logs: records/s
          accepted_traces: spans/s
          sent_metrics: points/s
          sent_logs: records/s
          sent_traces: spans/s
        queries:
          fresh_sources: 'count (nktp_watchdog_load{test_run_id="{{ .Args.runId }}"} and (time() - timestamp(nktp_watchdog_load{test_run_id="{{ .Args.runId }}"}) < 120))'
          delivered_metric_age: 'max (time() - timestamp(nktp_watchdog_load{test_run_id="{{ .Args.runId }}"}))'
          producer_ready: 'sum by (container) (kube_pod_container_status_ready{namespace="nktp",container=~"watchdog-node-metrics|watchdog-node-logs"})'
          producer_restarts: 'sum by (container) (kube_pod_container_status_restarts_total{namespace="nktp",container=~"watchdog-node-metrics|watchdog-node-logs"})'
          watchdog_cpu: 'rate(otelcol_process_cpu_seconds_total{job="nktp-watchdog"}[5m])'
          watchdog_rss: 'otelcol_process_memory_rss_bytes{job="nktp-watchdog"}'
          watchdog_heap: 'otelcol_process_runtime_heap_alloc_bytes{job="nktp-watchdog"}'
          watchdog_queue: 'otelcol_exporter_queue_size{job="nktp-watchdog"}'
          watchdog_inflight: 'otelcol_exporter_in_flight_requests{job="nktp-watchdog"}'
          watchdog_queue_capacity: 'otelcol_exporter_queue_capacity{job="nktp-watchdog"}'
          watchdog_self_metric_age: 'time() - timestamp(otelcol_process_memory_rss_bytes{job="nktp-watchdog"})'
          watchdog_restarts: 'kube_pod_container_status_restarts_total{namespace="nktp",pod=~"nktp-watchdog-collector-.+"}'
          watchdog_hpa_replicas: 'kube_horizontalpodautoscaler_status_current_replicas{namespace="nktp",horizontalpodautoscaler=~"nktp-watchdog.*"}'
          blackhole_cpu: 'rate(otelcol_process_cpu_seconds_total{job="nktp-watchdog-blackhole"}[5m])'
          blackhole_rss: 'otelcol_process_memory_rss_bytes{job="nktp-watchdog-blackhole"}'
          blackhole_self_metric_age: 'time() - timestamp(otelcol_process_memory_rss_bytes{job="nktp-watchdog-blackhole"})'
          blackhole_accepted_logs: 'sum by (instance) (rate(otelcol_receiver_accepted_log_records_total{job="nktp-watchdog-blackhole"}[5m]))'
          blackhole_refused_logs: 'sum by (instance) (rate(otelcol_receiver_refused_log_records_total{job="nktp-watchdog-blackhole"}[5m]))'
          blackhole_restarts: 'kube_pod_container_status_restarts_total{namespace="nktp",pod=~"nktp-watchdog-blackhole-collector-.+"}'
          accepted_metrics: 'sum by (instance, receiver) (rate(otelcol_receiver_accepted_metric_points_total{job="nktp-watchdog"}[5m]))'
          accepted_logs: 'sum by (instance) (rate(otelcol_receiver_accepted_log_records_total{job="nktp-watchdog"}[5m]))'
          accepted_traces: 'sum by (instance) (rate(otelcol_receiver_accepted_spans_total{job="nktp-watchdog"}[5m]))'
          sent_metrics: 'sum by (instance) (rate(otelcol_exporter_sent_metric_points_total{job="nktp-watchdog"}[5m]))'
          sent_logs: 'sum by (instance, exporter) (rate(otelcol_exporter_sent_log_records_total{job="nktp-watchdog"}[5m]))'
          sent_traces: 'sum by (instance) (rate(otelcol_exporter_sent_spans_total{job="nktp-watchdog"}[5m]))'
          refused_metrics: 'sum by (instance) (rate(otelcol_receiver_refused_metric_points_total{job="nktp-watchdog"}[5m]))'
          refused_logs: 'sum by (instance) (rate(otelcol_receiver_refused_log_records_total{job="nktp-watchdog"}[5m]))'
          refused_traces: 'sum by (instance) (rate(otelcol_receiver_refused_spans_total{job="nktp-watchdog"}[5m]))'
          enqueue_failed_metrics: 'sum by (instance) (rate(otelcol_exporter_enqueue_failed_metric_points_total{job="nktp-watchdog"}[5m]))'
          enqueue_failed_logs: 'sum by (instance, exporter) (rate(otelcol_exporter_enqueue_failed_log_records_total{job="nktp-watchdog"}[5m]))'
          enqueue_failed_traces: 'sum by (instance) (rate(otelcol_exporter_enqueue_failed_spans_total{job="nktp-watchdog"}[5m]))'
          send_failed_metrics: 'sum by (instance) (rate(otelcol_exporter_send_failed_metric_points_total{job="nktp-watchdog"}[5m]))'
          send_failed_logs: 'sum by (instance, exporter) (rate(otelcol_exporter_send_failed_log_records_total{job="nktp-watchdog"}[5m]))'
          send_failed_traces: 'sum by (instance) (rate(otelcol_exporter_send_failed_spans_total{job="nktp-watchdog"}[5m]))'
  - name: node-collectors-2
    generator: *sources
    measurement:
      type: noop
  - name: node-collectors-3
    generator: *sources
    measurement:
      type: noop
  - name: node-collectors-4
    generator: *sources
    measurement:
      type: noop
  - name: node-collectors-5
    generator: *sources
    measurement:
      type: noop
