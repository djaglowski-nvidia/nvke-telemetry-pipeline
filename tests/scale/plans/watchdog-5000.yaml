# 5,000 sources each send 100 metric points/minute and 100 logs/minute with 100 KiB bodies.
name: watchdog-5000
timeout: 45m
stages:
  - name: node-collectors
    generator:
      type: statefulset
      spec:
        count: 5
        replicas: 1000
        duration: 30m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: watchdog-5000
              scale.nktp.io/run-id: '{{ .Args.runId }}'
          spec:
            restartPolicy: Always
            automountServiceAccountToken: false
            nodeSelector:
              nodeGroup: customer-cpu
            tolerations:
              - key: skyhook.nvidia.com
                operator: Equal
                value: runtime-required
                effect: NoSchedule
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeAffinityPolicy: Honor
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    scale.nktp.io/workload: watchdog-5000
                    scale.nktp.io/run-id: '{{ .Args.runId }}'
            containers:
              - name: watchdog-node-metrics
                image: &telemetrygen ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - metrics
                  - --otlp-endpoint=nktp-watchdog-collector.nktp.svc:4318
                  - --otlp-http
                  - --otlp-insecure
                  - --duration=1h
                  - --workers=1
                  - --rate=1.6666666666666667
                  - --batch
                  - --batch-size=100
                  - --metric-type=Gauge
                  - --unique-timeseries=false
                  - --otlp-metric-name=nktp_watchdog_load
                  - --service=nktp-watchdog-load-node
                  - '--otlp-attributes=service.instance.id="$(POD_UID)"'
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
                  - '--telemetry-attributes=generator_instance="$(POD_NAME)"'
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
              - name: watchdog-node-logs
                image: *telemetrygen
                command: [/telemetrygen]
                args:
                  - logs
                  - --otlp-endpoint=nktp-watchdog-collector.nktp.svc:4318
                  - --otlp-http
                  - --otlp-insecure
                  - --duration=1h
                  - --workers=1
                  - --rate=1.6666666666666667
                  - --batch
                  - --batch-size=10
                  - --body=$(LOG_BODY)
                  - --service=nktp-watchdog-load-node
                  - '--otlp-attributes=service.instance.id="$(POD_UID)"'
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
                  - '--telemetry-attributes=generator_instance="$(POD_NAME)"'
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
                  - name: OTEL_EXPORTER_OTLP_LOGS_COMPRESSION
                    value: gzip
                  - name: LOG_BODY
                    valueFrom:
                      configMapKeyRef:
                        name: nktp-watchdog-load
                        key: log-body
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: "1"
                    memory: 512Mi
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 40m
        interval: 30s
        query_timeout: 20s
        measurements:
          - name: fresh_sources
            units: sources
            query: count (nktp_watchdog_load{test_run_id="{{ .Args.runId }}"} and (time() - timestamp(nktp_watchdog_load{test_run_id="{{ .Args.runId }}"}) < 120))
          - name: delivered_metric_age
            units: seconds
            query: max (time() - timestamp(nktp_watchdog_load{test_run_id="{{ .Args.runId }}"}))
          - name: producer_ready
            units: containers
            query: sum by (container) (kube_pod_container_status_ready{namespace="nktp",container=~"watchdog-node-metrics|watchdog-node-logs"})
          - name: producer_restarts
            units: restarts
            query: sum by (container) (kube_pod_container_status_restarts_total{namespace="nktp",container=~"watchdog-node-metrics|watchdog-node-logs"})
          - name: watchdog_cpu
            units: cores
            query: rate(otelcol_process_cpu_seconds_total{job="nktp-watchdog"}[5m])
          - name: watchdog_rss
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-watchdog"}
          - name: watchdog_heap
            units: bytes
            query: otelcol_process_runtime_heap_alloc_bytes{job="nktp-watchdog"}
          - name: watchdog_queue
            units: bytes
            query: otelcol_exporter_queue_size{job="nktp-watchdog"}
          - name: watchdog_inflight
            units: requests
            query: otelcol_exporter_in_flight_requests{job="nktp-watchdog"}
          - name: watchdog_queue_capacity
            units: bytes
            query: otelcol_exporter_queue_capacity{job="nktp-watchdog"}
          - name: watchdog_self_metric_age
            units: seconds
            query: time() - timestamp(otelcol_process_memory_rss_bytes{job="nktp-watchdog"})
          - name: watchdog_restarts
            units: restarts
            query: kube_pod_container_status_restarts_total{namespace="nktp",pod=~"nktp-watchdog-collector-.+"}
          - name: watchdog_hpa_replicas
            units: replicas
            query: kube_horizontalpodautoscaler_status_current_replicas{namespace="nktp",horizontalpodautoscaler=~"nktp-watchdog.*"}
          - name: blackhole_cpu
            units: cores
            query: rate(otelcol_process_cpu_seconds_total{job="nktp-watchdog-blackhole"}[5m])
          - name: blackhole_rss
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-watchdog-blackhole"}
          - name: blackhole_self_metric_age
            units: seconds
            query: time() - timestamp(otelcol_process_memory_rss_bytes{job="nktp-watchdog-blackhole"})
          - name: blackhole_accepted_logs
            units: records/s
            query: sum by (instance) (rate(otelcol_receiver_accepted_log_records_total{job="nktp-watchdog-blackhole"}[5m]))
          - name: blackhole_refused_logs
            units: records/s
            query: sum by (instance) (rate(otelcol_receiver_refused_log_records_total{job="nktp-watchdog-blackhole"}[5m]))
          - name: blackhole_restarts
            units: restarts
            query: kube_pod_container_status_restarts_total{namespace="nktp",pod=~"nktp-watchdog-blackhole-collector-.+"}
          - name: accepted_metrics
            units: points/s
            query: sum by (instance, receiver) (rate(otelcol_receiver_accepted_metric_points_total{job="nktp-watchdog"}[5m]))
          - name: accepted_logs
            units: records/s
            query: sum by (instance) (rate(otelcol_receiver_accepted_log_records_total{job="nktp-watchdog"}[5m]))
          - name: accepted_traces
            units: spans/s
            query: sum by (instance) (rate(otelcol_receiver_accepted_spans_total{job="nktp-watchdog"}[5m]))
          - name: sent_metrics
            units: points/s
            query: sum by (instance) (rate(otelcol_exporter_sent_metric_points_total{job="nktp-watchdog"}[5m]))
          - name: sent_logs
            units: records/s
            query: sum by (instance, exporter) (rate(otelcol_exporter_sent_log_records_total{job="nktp-watchdog"}[5m]))
          - name: sent_traces
            units: spans/s
            query: sum by (instance) (rate(otelcol_exporter_sent_spans_total{job="nktp-watchdog"}[5m]))
          - name: refused_metrics
            query: sum by (instance) (rate(otelcol_receiver_refused_metric_points_total{job="nktp-watchdog"}[5m]))
          - name: refused_logs
            query: sum by (instance) (rate(otelcol_receiver_refused_log_records_total{job="nktp-watchdog"}[5m]))
          - name: refused_traces
            query: sum by (instance) (rate(otelcol_receiver_refused_spans_total{job="nktp-watchdog"}[5m]))
          - name: enqueue_failed_metrics
            query: sum by (instance) (rate(otelcol_exporter_enqueue_failed_metric_points_total{job="nktp-watchdog"}[5m]))
          - name: enqueue_failed_logs
            query: sum by (instance, exporter) (rate(otelcol_exporter_enqueue_failed_log_records_total{job="nktp-watchdog"}[5m]))
          - name: enqueue_failed_traces
            query: sum by (instance) (rate(otelcol_exporter_enqueue_failed_spans_total{job="nktp-watchdog"}[5m]))
          - name: send_failed_metrics
            query: sum by (instance) (rate(otelcol_exporter_send_failed_metric_points_total{job="nktp-watchdog"}[5m]))
          - name: send_failed_logs
            query: sum by (instance, exporter) (rate(otelcol_exporter_send_failed_log_records_total{job="nktp-watchdog"}[5m]))
          - name: send_failed_traces
            query: sum by (instance) (rate(otelcol_exporter_send_failed_spans_total{job="nktp-watchdog"}[5m]))
