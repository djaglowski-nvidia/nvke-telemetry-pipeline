# Upstream images only. Install ../scale-test-values.yaml before running.
# Offered target: 1M Avalanche series per scrape + 1,013,760 new telemetrygen identities/minute.
# Measurements report point rates, not stored distinct-series cardinality.
# Telemetrygen continuously creates new identities throughout this ten-minute run.
name: metrics-2m
timeout: 11m
stages:
  - name: load
    generators:
    - name: telemetrygen
      type: job
      spec:
        # The scale profile adds a client-address label at the metrics gateway.
        parallelism: 6
        podTemplate:
          metadata:
            namespace: nktp
          spec:
            containers:
              - name: generator
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - metrics
                  - --otlp-endpoint=nktp-gateway-metrics-collector.nktp.svc:4317
                  - --otlp-insecure
                  - --otlp-metric-name=nktp_scale_e2e
                  - --metric-type=Gauge
                  - --duration=10m
                  - --workers=128
                  - --rate=22
                  - --unique-timeseries
                  # Longer than the run: the first uniqueness timer never resets.
                  - --unique-timeseries-duration=24h
                  - --batch
                  - --batch-size=100
                  - --allow-export-failures
                  - '--telemetry-attributes=test_run_id="{{ .Args.runId }}"'
                  - '--telemetry-attributes=load_generator="telemetrygen"'
    - name: avalanche
      type: job
      spec:
        parallelism: 10
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: avalanche
          spec:
            containers:
              - name: generator
                image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
                command: [/bin/sh, -c]
                args:
                  - |
                    "$@" --const-label="generator_instance=$(hostname)" &
                    generator=$!
                    # cleanup stops and reaps Avalanche on every exit path.
                    cleanup() {
                      kill "$generator" 2>/dev/null || true
                      wait "$generator" 2>/dev/null || true
                    }
                    trap cleanup EXIT
                    trap 'exit 143' TERM
                    trap 'exit 130' INT
                    for second in $(seq 600)
                    do
                      sleep 1
                      if ! kill -0 "$generator" 2>/dev/null
                      then
                        wait "$generator" || exit "$?"
                        echo "Avalanche exited before the duration elapsed" >&2
                        exit 1
                      fi
                    done
                    # A live workload reaching the duration is the only successful exit.
                    exit 0
                  - avalanche
                  - /bin/avalanche
                  - --port=9001
                  - --gauge-metric-count=100
                  - --series-count=1000
                  - --series-interval=0
                  - --metric-interval=0
                  - --series-operation-mode=disabled
                  - --const-label=test_run_id={{ .Args.runId }}
                  - --const-label=load_generator=avalanche
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 10m30s
        interval: 30s
        query_timeout: 30s
        measurements:
          # In this dedicated setup, gateway gRPC input is telemetrygen traffic.
          - name: telemetrygen_received_points_per_second
            units: points/s
            query: sum(rate(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics",receiver="otlp",transport="grpc"}[2m]))
          # Collector self-metrics also include background traffic.
          - name: gateway_received_points_per_second
            units: points/s
            query: sum by (transport) (rate(otelcol_receiver_accepted_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          - name: gateway_sent_points_per_second
            units: points/s
            query: sum(rate(otelcol_exporter_sent_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          - name: gateway_refused_points_per_second
            units: points/s
            query: sum(rate(otelcol_receiver_refused_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          - name: gateway_failed_points_per_second
            units: points/s
            query: sum(rate(otelcol_exporter_send_failed_metric_points_total{job="nktp-gateway-metrics"}[2m]))
          - name: gateway_memory_bytes
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-gateway-metrics"}
          # Observe each large-target collector independently.
          - name: large_pool_cpu_cores
            units: cores
            query: rate(otelcol_process_cpu_seconds_total{job="nktp-large-target-metrics"}[2m])
          - name: large_pool_memory_bytes
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-large-target-metrics"}
          - name: large_pool_queue_utilization_percent
            units: percent
            query: 100 * (otelcol_exporter_queue_size{job="nktp-large-target-metrics",exporter="otlp_http",data_type="metrics"} / otelcol_exporter_queue_capacity{job="nktp-large-target-metrics",exporter="otlp_http",data_type="metrics"})
          - name: large_pool_received_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_receiver_accepted_metric_points_total{job="nktp-large-target-metrics"}[2m]))
          - name: large_pool_sent_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_exporter_sent_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_http"}[2m]))
          - name: large_pool_refused_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_receiver_refused_metric_points_total{job="nktp-large-target-metrics"}[2m]))
          - name: large_pool_enqueue_failed_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_exporter_enqueue_failed_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_http"}[2m]))
          - name: large_pool_send_failed_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_exporter_send_failed_metric_points_total{job="nktp-large-target-metrics",exporter="otlp_http"}[2m]))
          # Receiver acceptance is the endpoint for the blackhole's synchronous discard path.
          - name: blackhole_cpu_cores
            units: cores
            query: rate(otelcol_process_cpu_seconds_total{job="nktp-scale-blackhole"}[2m])
          - name: blackhole_memory_bytes
            units: bytes
            query: otelcol_process_memory_rss_bytes{job="nktp-scale-blackhole"}
          - name: blackhole_received_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_receiver_accepted_metric_points_total{job="nktp-scale-blackhole",receiver="otlp"}[2m]))
          - name: blackhole_refused_points_per_second
            units: points/s
            query: sum by (instance) (rate(otelcol_receiver_refused_metric_points_total{job="nktp-scale-blackhole",receiver="otlp"}[2m]))
          # Producer observations are per process in this dedicated scale cluster.
          - name: producer_cpu_cores
            units: cores
            query: sum by (load_generator, k8s_node_name, producer_pid) (rate(process_cpu_time_seconds_total{job="nktp-scale-producers",state=~"user|system"}[1m]))
          - name: producer_memory_bytes
            units: bytes
            query: process_memory_usage_bytes{job="nktp-scale-producers"}
          - name: avalanche_scrape_seconds
            units: seconds
            query: max by (instance) (scrape_duration_seconds{scale_generator="avalanche",nktp_metrics_pool="large-target"})
          - name: avalanche_fresh_targets
            units: targets
            query: count((up{scale_generator="avalanche",nktp_metrics_pool="large-target"} == 1) and (time() - timestamp(up{scale_generator="avalanche",nktp_metrics_pool="large-target"}) < 45))
          - name: avalanche_scrape_samples
            units: samples
            query: scrape_samples_scraped{scale_generator="avalanche",nktp_metrics_pool="large-target"}
