# Use ../10k-pods-values.yaml. Run guide: ../10k-pods.md.
name: pod-churn-10k
timeout: 45m
stages:
- name: churn
  generators:
  - name: churn
    type: job
    spec:
      count: 100
      parallelism: 100
      completions: 400
      podTemplate:
        metadata:
          namespace: nktp-churn-10k
          labels:
            scale.nktp.io/workload: pod-churn
            scale.nktp.io/run-id: '{{ .Args.runId }}'
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 5
          nodeSelector:
            nodeGroup: customer-cpu
          tolerations:
          - key: skyhook.nvidia.com
            operator: Equal
            value: runtime-required
            effect: NoSchedule
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                scale.nktp.io/workload: pod-churn
                scale.nktp.io/run-id: '{{ .Args.runId }}'
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: sleeper
            image: public.ecr.aws/docker/library/busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sleep
            - '600'
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
  measurement:
    type: prometheus
    spec:
      endpoint: http://127.0.0.1:9090
      duration: 35m
      interval: 30s
      query_timeout: 15s
      measurements:
        - name: churn_phases
          units: pods
          query: >-
            sum by (phase) (
              max by (namespace,pod,phase) (
                kube_pod_status_phase{namespace="nktp-churn-10k"}
                and (time() - timestamp(kube_pod_status_phase{namespace="nktp-churn-10k"}) < 90)
              )
              and on (namespace,pod) max by (namespace,pod) (
                kube_pod_labels{namespace="nktp-churn-10k",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(kube_pod_labels{namespace="nktp-churn-10k",label_scale_nktp_io_run_id="{{ .Args.runId }}"}) < 90)
              )
            )
        - name: churn_ksm_inventory_by_node
          units: pods
          query: >-
            count by (node) (
              max by (namespace,pod,node) (
                kube_pod_info{namespace="nktp-churn-10k"}
                and (time() - timestamp(kube_pod_info{namespace="nktp-churn-10k"}) < 90)
              )
              and on (namespace,pod) max by (namespace,pod) (
                kube_pod_labels{namespace="nktp-churn-10k",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(kube_pod_labels{namespace="nktp-churn-10k",label_scale_nktp_io_run_id="{{ .Args.runId }}"}) < 90)
              )
            )
        - name: component_cpu_cores
          units: cores
          query: sum by(pod,container)(rate(container_cpu_usage_seconds_total{namespace="nktp",container!="",container!="POD"}[2m]))
        - name: component_working_set_bytes
          units: bytes
          query: max by(pod,container)(container_memory_working_set_bytes{namespace="nktp",container!="",container!="POD"})
        - name: component_data_age_seconds
          units: s
          query: max by(pod,container)(time()-timestamp(container_memory_working_set_bytes{namespace="nktp",container!="",container!="POD"}))
        - name: component_restarts
          units: restarts
          query: kube_pod_container_status_restarts_total{namespace="nktp"}
        - name: queue_utilization_ratio
          units: ratio
          query: otelcol_exporter_queue_size{job=~"nktp-.*"} / otelcol_exporter_queue_capacity{job=~"nktp-.*"}
        - name: accepted_metrics_s
          units: points/s
          query: rate(otelcol_receiver_accepted_metric_points_total{job=~"nktp-.*"}[2m])
        - name: sent_metrics_s
          units: points/s
          query: rate(otelcol_exporter_sent_metric_points_total{job=~"nktp-.*"}[2m])
        - name: refused_metrics_s
          units: points/s
          query: rate(otelcol_receiver_refused_metric_points_total{job=~"nktp-.*"}[2m])
        - name: enqueue_failed_metrics_s
          units: points/s
          query: rate(otelcol_exporter_enqueue_failed_metric_points_total{job=~"nktp-.*"}[2m])
        - name: send_failed_metrics_s
          units: points/s
          query: rate(otelcol_exporter_send_failed_metric_points_total{job=~"nktp-.*"}[2m])
        - name: ksm_up
          units: ratio
          query: up{job=~"nktp/nktp-ksm-.*"} and (time() - timestamp(up{job=~"nktp/nktp-ksm-.*"}) < 90)
        - name: ksm_scrape_seconds
          units: s
          query: scrape_duration_seconds{job=~"nktp/nktp-ksm-.*"}
        - name: ksm_scrape_samples
          units: samples
          query: scrape_samples_scraped{job=~"nktp/nktp-ksm-.*"}
        - name: ksm_watch_errors_s
          units: errors/s
          query: rate(kube_state_metrics_watch_total{result="error"}[2m])
        - name: ksm_list_errors_s
          units: errors/s
          query: rate(kube_state_metrics_list_total{result="error"}[2m])
        - name: api_requests_s
          units: requests/s
          query: sum by(resource,verb,code)(rate(apiserver_request_total{resource=~"pods|jobs|events"}[2m]))
