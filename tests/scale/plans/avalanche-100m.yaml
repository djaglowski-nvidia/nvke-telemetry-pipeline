  measurement:
    type: prometheus
    spec:
      endpoint: http://127.0.0.1:9090
      duration: 100m
      interval: 60s
      query_timeout: 30s
      # Compare each bucket with the workload table in ../avalanche-100m.md.
      # Missing series stay absent. History queries describe the preceding 30 minutes.
      measurements:
        - name: fresh_targets_by_bucket
          units: targets
          query: |-
            count by (scale_bucket, scale_scraper_pool) (
              max by (scale_bucket, scale_scraper_pool, generator_instance) (
                (up{test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(up{test_run_id="{{ .Args.runId }}"}) < 120)) == 1
              )
            )
        - name: fresh_scraped_targets_by_bucket
          units: targets
          query: |-
            count by (scale_bucket, scale_scraper_pool) (
              group by (scale_bucket, scale_scraper_pool, generator_instance) (
                scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}) < 120)
              )
            )
        - name: minimum_scraped_samples_by_bucket
          units: samples/target
          query: |-
            min by (scale_bucket, scale_scraper_pool) (
              scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}) < 120)
            )
        - name: maximum_scraped_samples_by_bucket
          units: samples/target
          query: |-
            max by (scale_bucket, scale_scraper_pool) (
              scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}) < 120)
            )
        - name: scraped_sample_extremes_by_target
          units: samples/target
          query: |-
            topk by (scale_bucket, scale_scraper_pool) (1,
              scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}) < 120)
            )
            or
            bottomk by (scale_bucket, scale_scraper_pool) (1,
              scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_scraped{test_run_id="{{ .Args.runId }}"}) < 120)
            )
        - name: fresh_retained_targets_by_bucket
          units: targets
          query: |-
            count by (scale_bucket, scale_scraper_pool) (
              group by (scale_bucket, scale_scraper_pool, generator_instance) (
                scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}) < 120)
              )
            )
        - name: minimum_retained_samples_by_bucket
          units: samples/target
          query: |-
            min by (scale_bucket, scale_scraper_pool) (
              scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}) < 120)
            )
        - name: maximum_retained_samples_by_bucket
          units: samples/target
          query: |-
            max by (scale_bucket, scale_scraper_pool) (
              scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}) < 120)
            )
        - name: retained_sample_extremes_by_target
          units: samples/target
          query: |-
            topk by (scale_bucket, scale_scraper_pool) (1,
              scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}
              and (time() - timestamp(scrape_samples_post_metric_relabeling{test_run_id="{{ .Args.runId }}"}) < 120)
