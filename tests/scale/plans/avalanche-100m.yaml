# 15,658 targets in six parallel generators offer 100,000,000 active series.
# Install ../avalanche-100m-values.yaml first. Observations do not enforce acceptance.
name: avalanche-100m-defaults
timeout: 110m
stages:
- name: load
  generators:
  - name: avalanche-1k
    type: pod
    spec:
      count: 7960
      podTemplate:
        metadata:
          labels:
            scale.nktp.io/workload: avalanche-100m
            scale.nktp.io/bucket: 1k
            scale.nktp.io/run-id: '{{ .Args.runId }}'
          namespace: nktp
        spec:
          nodeSelector:
            nodeGroup: customer-cpu
          tolerations:
          - key: skyhook.nvidia.com
            operator: Equal
            value: runtime-required
            effect: NoSchedule
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 10
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                scale.nktp.io/workload: avalanche-100m
                scale.nktp.io/bucket: 1k
                scale.nktp.io/run-id: '{{ .Args.runId }}'
          containers:
          - name: avalanche-1k
            image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
            args:
            - |
              "$@" &
              generator=$!
              cleanup() {
                kill "$generator" 2>/dev/null || true
                wait "$generator" 2>/dev/null || true
              }
              trap cleanup EXIT
              trap 'exit 143' TERM
              trap 'exit 130' INT
              for interval in $(seq 450)
              do
                sleep 10
                if ! kill -0 "$generator" 2>/dev/null
                then
                  wait "$generator" || exit "$?"
                  echo "Avalanche exited before the duration elapsed" >&2
                  exit 1
                fi
              done
            - avalanche
            - /bin/avalanche
            - --port=9001
            - --gauge-metric-count=0
            - --counter-metric-count=10
            - --series-count=100
            - --label-count=4
            - --series-interval=0
            - --metric-interval=0
            - --value-interval=30
            - --series-operation-mode=disabled
            ports:
            - name: metrics
              containerPort: 9001
            readinessProbe:
              tcpSocket:
                port: metrics
              periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
            command:
            - /bin/sh
            - -c
          restartPolicy: Never
          activeDeadlineSeconds: 5700
