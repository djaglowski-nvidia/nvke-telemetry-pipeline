# Mixed workload on 100 real workers. See ../mixed-workload.md.
# Install ../mixed-workload-values.yaml first. Only runId is a plan argument.
name: mixed-workload
execution: parallel
timeout: 105m
stages:
  - name: small-scraped
    generator:
      type: statefulset
      spec:
        count: 10
        replicas: 500
        duration: 90m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: mixed-workload
              scale.nktp.io/group: small-scraped
              scale.nktp.io/run-id: '{{ .Args.runId }}'
              scale.nktp.io/bucket: small
              scale.nktp.io/metric-source: scraped
              scale.nktp.io/stdout: 'true'
          spec:
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 100
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeAffinityPolicy: Honor
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    scale.nktp.io/workload: mixed-workload
                    scale.nktp.io/group: small-scraped
                    scale.nktp.io/run-id: '{{ .Args.runId }}'
            containers:
              - name: avalanche
                image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
                command: [/bin/avalanche]
                args:
                  - --port=9001
                  - --gauge-metric-count=0
                  - --label-count=4
                  - --series-interval=0
                  - --metric-interval=0
                  - --value-interval=30
                  - --series-operation-mode=disabled
                  - --counter-metric-count=1
                  - --series-count=200
                  - --const-label=generator_instance=$(POD_UID)
                ports:
                  - {name: metrics, containerPort: 9001}
                readinessProbe:
                  tcpSocket: {port: metrics}
                  periodSeconds: 5
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
                env:
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: "metadata.uid"}}
              - name: vector-stdout-small
                image: ghcr.io/vectordotdev/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
                args: [--threads, '1', --config, /etc/vector/vector.yaml]
                ports:
                  - {name: vector-metrics, containerPort: 9598}
                readinessProbe:
                  tcpSocket: {port: vector-metrics}
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 128Mi}
                volumeMounts:
                  - {name: vector-config, mountPath: /etc/vector, readOnly: true}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
            volumes:
              - name: vector-config
                configMap: {name: nktp-mixed-workload-stdout-small}
    measurement: {type: noop}

  - name: small-instrumented
    generator:
      type: statefulset
      spec:
        count: 10
        replicas: 400
        duration: 90m
        podTemplate:
          metadata:
            namespace: nktp
            labels:
              scale.nktp.io/workload: mixed-workload
              scale.nktp.io/group: small-instrumented
              scale.nktp.io/run-id: '{{ .Args.runId }}'
              scale.nktp.io/bucket: small
              scale.nktp.io/metric-source: otlp
              scale.nktp.io/stdout: 'true'
          spec:
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: false
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 100
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
                nodeAffinityPolicy: Honor
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    scale.nktp.io/workload: mixed-workload
                    scale.nktp.io/group: small-instrumented
                    scale.nktp.io/run-id: '{{ .Args.runId }}'
            containers:
              - name: avalanche
                image: quay.io/prometheuscommunity/avalanche:v0.7.0@sha256:ea02e9599fcbb59a6fc7396656434faf200db7f1c259802e3dbb38cec81bd12a
                command: [/bin/avalanche]
                args:
                  - --port=9001
                  - --gauge-metric-count=0
                  - --label-count=4
                  - --series-interval=0
                  - --metric-interval=0
                  - --value-interval=30
                  - --series-operation-mode=disabled
                  - --counter-metric-count=1
                  - --series-count=250
                  - --const-label=generator_instance=$(POD_UID)
                ports:
                  - {name: private-metrics, containerPort: 9001}
                readinessProbe:
                  tcpSocket: {port: private-metrics}
                  periodSeconds: 5
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 64Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
                env:
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: "metadata.uid"}}
              - name: otlp-metrics
                image: otel/opentelemetry-collector-k8s:0.162.0@sha256:ed6862e1506e11c08a0ec4cc7e1395eb5cf10e3acf2c2ba3846edc1b6b3916d6
                args:
                  - --config=/etc/metrics/collector.yaml
                env:
                  - name: POD_NAME
                    valueFrom: {fieldRef: {fieldPath: "metadata.name"}}
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: "metadata.uid"}}
                  - name: NODE_NAME
                    valueFrom: {fieldRef: {fieldPath: "spec.nodeName"}}
                  - name: RUN_ID
                    valueFrom: {fieldRef: {fieldPath: "metadata.labels['scale.nktp.io/run-id']"}}
                ports:
                  - {name: health, containerPort: 13133}
                readinessProbe:
                  httpGet: {port: health, path: /}
                volumeMounts:
                  - {name: metrics-config, mountPath: /etc/metrics, readOnly: true}
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 256Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
              - name: vector-stdout-small
                image: ghcr.io/vectordotdev/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
                args: [--threads, '1', --config, /etc/vector/vector.yaml]
                ports:
                  - {name: vector-metrics, containerPort: 9598}
                readinessProbe:
                  tcpSocket: {port: vector-metrics}
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 128Mi}
                volumeMounts:
                  - {name: vector-config, mountPath: /etc/vector, readOnly: true}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
              - name: traces
                image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.159.0@sha256:bad7fde3119476a9177cc4b9f04307c9876fca5b5584e009aebd7123d7557658
                command: [/telemetrygen]
                args:
                  - traces
                  - --otlp-endpoint=nktp-mixed-workload-local.nktp.svc:4317
                  - --otlp-insecure
                  - --duration=inf
                  - --workers=1
                  - --child-spans=1
                  - --rate=$(ITEM_RATE)
                  - --batch
                  - --batch-size=1
                  - --service=mixed-workload-traces-small
                  - --telemetry-attributes=test_run_id="$(RUN_ID)"
                  - --telemetry-attributes=scale_bucket="small"
                  - --telemetry-attributes=payload="$(PAYLOAD)"
                  - --otlp-attributes=service.instance.id="$(POD_UID)"
                  - --telemetry-attributes=scale_payload_bytes="1024"
                env:
                  - name: ITEM_RATE
                    valueFrom: {configMapKeyRef: {name: nktp-mixed-workload-payloads, key: spans-small-rate}}
                  - name: RUN_ID
                    valueFrom: {fieldRef: {fieldPath: "metadata.labels['scale.nktp.io/run-id']"}}
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: "metadata.uid"}}
                  - name: PAYLOAD
                    valueFrom: {configMapKeyRef: {name: nktp-mixed-workload-payloads, key: spans-small}}
                  - name: OTEL_TRACES_SAMPLER
                    value: always_on
                  - name: OTEL_BSP_MAX_QUEUE_SIZE
                    value: '2048'
                resources:
                  requests: {cpu: 25m, memory: 64Mi}
                  limits: {cpu: 500m, memory: 256Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
            volumes:
              - name: vector-config
                configMap: {name: nktp-mixed-workload-stdout-small}
              - name: metrics-config
                configMap: {name: nktp-mixed-workload-otlp-metrics}
    measurement: {type: noop}

