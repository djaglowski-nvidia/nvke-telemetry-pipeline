                  - --metric-interval=0
                  - --value-interval=30
                  - --series-operation-mode=disabled
                  - --counter-metric-count=1
                  - --series-count=20000
                  - --const-label=generator_instance=$(POD_UID)
                ports:
                  - {name: metrics, containerPort: 9001}
                readinessProbe:
                  tcpSocket: {port: metrics}
                  periodSeconds: 5
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 64Mi}
                securityContext:
