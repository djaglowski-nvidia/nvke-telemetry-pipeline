                image: quay.io/kube-burner/kube-burner:v2.8.6@sha256:340a8e1428bf042e944e605487bd9d1c9d5195d0f9c2599b4d31ca114b1864ae
                command: [/bin/kube-burner]
                workingDir: /etc/kube-burner
                args:
                  - init
                  - --config=config.yaml
                  - --uuid=$(POD_UID)
                  - --timeout=95m
                  - --skip-log-file
                env:
                  - name: POD_NAME
                    valueFrom: {fieldRef: {fieldPath: metadata.name}}
                  - name: POD_UID
                    valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                  - name: EVENT_RUN_ID
                    value: '{{ .Args.runId }}'
                resources:
                  requests: {cpu: 250m, memory: 256Mi}
                  limits: {cpu: '1', memory: 1Gi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65532
                  capabilities: {drop: [ALL]}
                volumeMounts:
