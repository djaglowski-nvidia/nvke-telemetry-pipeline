            terminationGracePeriodSeconds: 30
            automountServiceAccountToken: true
            nodeSelector: {nodeGroup: customer-cpu}
            tolerations:
              - {key: skyhook.nvidia.com, operator: Equal, value: runtime-required, effect: NoSchedule}
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        scale.nktp.io/workload: mixed-workload-events
            containers:
