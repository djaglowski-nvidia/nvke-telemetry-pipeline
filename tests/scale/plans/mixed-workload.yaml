                  requests: {cpu: 300m, memory: 1172Mi}
                  limits: {cpu: 600m, memory: 2344Mi}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
    measurement: {type: noop}

  - name: observations
    generator:
      type: noop
    measurement:
      type: prometheus
      spec:
        endpoint: http://127.0.0.1:9090
        duration: 100m
        interval: 15s
        query_timeout: 10s
        measurements:
          - name: fresh_targets
            units: targets
            query: >-
              count by (scale_node,scale_workload,scale_group,metric_bucket) (
                up{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"} == 1 and (time() - timestamp(up{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
              )
          - name: target_series
            units: series
            query: >-
              sum by (scale_node,scale_workload,scale_group,metric_bucket) (
                scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
              )
          - name: target_min_samples
            units: series
            query: >-
              min by (scale_node,scale_workload,scale_group,metric_bucket) (
                scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
              )
          - name: target_max_samples
            units: series
            query: >-
              max by (scale_node,scale_workload,scale_group,metric_bucket) (
                scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(scrape_samples_scraped{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}) < 120)
              )
          - name: scrape_duration
            units: seconds
            query: >-
              scrape_duration_seconds{scale_workload=~"mixed-workload|mixed-workload-large",test_run_id="{{ .Args.runId }}"}
          - name: producer_placement
            units: pods
            query: >-
              count by (node,label_scale_nktp_io_group,label_scale_nktp_io_bucket) (
                max by (namespace,pod,node) (kube_pod_info{namespace="nktp",node!=""})
                * on (namespace,pod) group_left(label_scale_nktp_io_group,label_scale_nktp_io_bucket)
                  max by (namespace,pod,label_scale_nktp_io_group,label_scale_nktp_io_bucket) (kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"})
              )
          - name: producer_ready
            units: bool
            query: >-
              kube_pod_container_status_ready{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_restarts
            units: restarts
            query: >-
              kube_pod_container_status_restarts_total{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_last_termination
            units: info
            query: >-
              kube_pod_container_status_last_terminated_reason{namespace="nktp"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_cpu
            units: cores
            query: >-
              rate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m])
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_memory
            units: bytes
            query: >-
              container_memory_working_set_bytes{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: producer_throttling
            units: ratio
            query: >-
              (rate(container_cpu_cfs_throttled_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m])
               / rate(container_cpu_cfs_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"scale-.+",container!="",container!="POD"}[2m]))
              and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
          - name: stdout_records
            units: records/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
          # Subtract one newline per console record to count body bytes.
          - name: stdout_body_bytes
            units: bytes/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(vector_component_sent_bytes_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
              - sum by (scale_node,scale_bucket) (rate(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}[5m]))
          - name: stdout_emitters
            units: pods
            query: >-
              count by (scale_node,scale_bucket) (
                vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(vector_component_sent_events_total{component_id="stdout_load",test_run_id="{{ .Args.runId }}"}) < 90)
              )
          - name: received_stdout_records
            units: records/s
            query: >-
              sum by (scale_node,scale_bucket,scale_payload_bytes) (
                rate(nktp_scale_log_records_total[5m])
                and on (source_pod) label_replace(kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"},"source_pod","$1","pod","(.+)")
              )
          - name: received_stdout_bytes
            units: bytes/s
            query: >-
              sum by (scale_node,scale_bucket,scale_payload_bytes) (
                rate(nktp_scale_logs_payload_bytes_total[5m])
                and on (source_pod) label_replace(kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"},"source_pod","$1","pod","(.+)")
              )
          - name: received_spans
            units: spans/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(nktp_scale_spans_total{test_run_id="{{ .Args.runId }}"}[5m]))
          - name: received_span_bytes
            units: bytes/s
            query: >-
              sum by (scale_node,scale_bucket) (rate(nktp_scale_spans_payload_bytes_total{test_run_id="{{ .Args.runId }}"}[5m]))
          - name: payload_count_errors
            units: points/s
            query: >-
              rate(otelcol_deltatocumulative_datapoints_total{job="nktp-daemonset",error!=""}[5m])
          - name: filelog_open_files
            units: files
            query: >-
              otelcol_fileconsumer_open_files{job="nktp-daemonset"}
          - name: filelog_reading_files
            units: files
            query: >-
              otelcol_fileconsumer_reading_files{job="nktp-daemonset"}
          - name: otlp_source_series
            units: series
            query: >-
              sum by (scale_node) (
                nktp_scale_otlp_source_series{test_run_id="{{ .Args.runId }}"}
                and (time() - timestamp(nktp_scale_otlp_source_series{test_run_id="{{ .Args.runId }}"}) < 90)
              )
          - name: otlp_sources_ready
            units: sources
            query: >-
              sum by (scale_node) (
                nktp_scale_otlp_source_up{test_run_id="{{ .Args.runId }}"} == 1
                and (time() - timestamp(nktp_scale_otlp_source_up{test_run_id="{{ .Args.runId }}"}) < 90)
              )
          - name: event_receiver_records
            units: records/s
            query: >-
              rate(otelcol_receiver_accepted_log_records_total{job="nktp-cluster-events",receiver="k8s_events"}[5m])
          - name: event_running_producers
            units: pods
            query: >-
              sum by (node) (
                kube_pod_container_status_running{namespace="nktp",container="kube-burner-events"}
                * on (namespace,pod) group_left(node) kube_pod_info{namespace="nktp"}
                and on (namespace,pod) kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
              )
          # Shared selectors preserve each component, Pod and container in result labels.
          - name: component_cpu
            units: cores
            query: >-
              rate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}[5m])
          - name: component_cpu_short
            units: cores
            query: >-
              irate(container_cpu_usage_seconds_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}[2m])
          - name: component_working_set
            units: bytes
            query: >-
              container_memory_working_set_bytes{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}
          - name: component_memory_usage
            units: bytes
            query: >-
              container_memory_usage_bytes{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}
          - name: component_throttling
            units: ratio
            query: >-
              rate(container_cpu_cfs_throttled_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}[5m])
              / rate(container_cpu_cfs_periods_total{namespace="nktp",job="kubelet-cadvisor",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container=~"otc-container|otc-sidecar"}[5m])
          - name: component_heap
            units: bytes
            query: >-
              otelcol_process_runtime_heap_alloc_bytes{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: component_rss
            units: bytes
            query: >-
              otelcol_process_memory_rss_bytes{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: self_metric_age
            units: seconds
            query: >-
              time() - timestamp(otelcol_process_memory_rss_bytes{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"})
          - name: queue_size
            units: bytes
            query: >-
              otelcol_exporter_queue_size{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: queue_capacity
            units: bytes
            query: >-
              otelcol_exporter_queue_capacity{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: queue_occupancy
            units: ratio
            query: >-
              otelcol_exporter_queue_size{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
              / ignoring(data_type) otelcol_exporter_queue_capacity{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}
          - name: pod_inventory
            units: info
            query: >-
              kube_pod_info{namespace="nktp"} and on (namespace,pod) (
                kube_pod_info{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+"} or kube_pod_labels{namespace="nktp",label_scale_nktp_io_run_id="{{ .Args.runId }}"}
              )
          - name: component_ready
            units: bool
            query: >-
              kube_pod_container_status_ready{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-container"}
          - name: component_restarts
            units: restarts
            query: >-
              kube_pod_container_status_restarts_total{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-container"}
          - name: component_last_termination
            units: info
            query: >-
              kube_pod_container_status_last_terminated_reason{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-container"}
          - name: sidecar_ready
            units: bool
            query: >-
              kube_pod_init_container_status_ready{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-sidecar"}
          - name: sidecar_restarts
            units: restarts
            query: >-
              kube_pod_init_container_status_restarts_total{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-sidecar"}
          - name: sidecar_last_termination
            units: info
            query: >-
              kube_pod_init_container_status_last_terminated_reason{namespace="nktp",pod=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector-.+",container="otc-sidecar"}
          - name: hpa_current_replicas
            units: replicas
            query: >-
              kube_horizontalpodautoscaler_status_current_replicas{namespace="nktp",horizontalpodautoscaler=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector"}
          - name: hpa_desired_replicas
            units: replicas
            query: >-
              kube_horizontalpodautoscaler_status_desired_replicas{namespace="nktp",horizontalpodautoscaler=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector"}
          - name: hpa_max_replicas
            units: replicas
            query: >-
              kube_horizontalpodautoscaler_spec_max_replicas{namespace="nktp",horizontalpodautoscaler=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector"}
          - name: hpa_conditions
            units: bool
            query: >-
              kube_horizontalpodautoscaler_status_condition{namespace="nktp",horizontalpodautoscaler=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)-collector"}
          - name: receiver_accepted_metrics
            units: points/s
            query: >-
              rate(otelcol_receiver_accepted_metric_points_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: receiver_refused_metrics
            units: points/s
            query: >-
              rate(otelcol_receiver_refused_metric_points_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_sent_metrics
            units: points/s
            query: >-
              rate(otelcol_exporter_sent_metric_points_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_enqueue_failed_metrics
            units: points/s
            query: >-
              rate(otelcol_exporter_enqueue_failed_metric_points_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_send_failed_metrics
            units: points/s
            query: >-
              rate(otelcol_exporter_send_failed_metric_points_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: receiver_accepted_logs
            units: records/s
            query: >-
              rate(otelcol_receiver_accepted_log_records_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: receiver_refused_logs
            units: records/s
            query: >-
              rate(otelcol_receiver_refused_log_records_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_sent_logs
            units: records/s
            query: >-
              rate(otelcol_exporter_sent_log_records_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_enqueue_failed_logs
            units: records/s
            query: >-
              rate(otelcol_exporter_enqueue_failed_log_records_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_send_failed_logs
            units: records/s
            query: >-
              rate(otelcol_exporter_send_failed_log_records_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: receiver_accepted_spans
            units: spans/s
            query: >-
              rate(otelcol_receiver_accepted_spans_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: receiver_refused_spans
            units: spans/s
            query: >-
              rate(otelcol_receiver_refused_spans_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_sent_spans
            units: spans/s
            query: >-
              rate(otelcol_exporter_sent_spans_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_enqueue_failed_spans
            units: spans/s
            query: >-
              rate(otelcol_exporter_enqueue_failed_spans_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: exporter_send_failed_spans
            units: spans/s
            query: >-
              rate(otelcol_exporter_send_failed_spans_total{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: serialized_bytes
            units: bytes/s
            query: >-
              rate(otelcol_exporter_enqueue_size_bytes_sum{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
          - name: dispatched_bytes
            units: bytes/s
            query: >-
              rate(otelcol_exporter_queue_batch_send_size_bytes_sum{job=~"nktp-(daemonset|gateway-(metrics|logs|traces)|large-target-metrics|cluster-events|watchdog|mixed-workload-blackhole)(-sidecar)?|nktp-mixed-workload-metrics-adapter"}[5m])
