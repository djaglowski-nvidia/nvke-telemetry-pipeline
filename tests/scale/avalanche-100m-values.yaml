# EKS placement and test resources for the completed 100M Avalanche workload.
# NKTP resources, autoscaling, runtime and queues inherit chart defaults.
# Blackhole discards generated metrics and retains performance observations in LGTM.
watchdog:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
    targetAllocator:
      nodeSelector:
        nodeGroup: system-cpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: system-workload
gateway_metrics:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
  otelcol:
    config:
      exporters:
        otlp_http:
          endpoint: http://nktp-scale-blackhole-collector:4318
gateway_logs:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
gateway_traces:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
large_target_metrics:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
    targetAllocator:
      nodeSelector:
        nodeGroup: system-cpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: system-workload
cluster_events:
  kubernetes:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
daemonset:
  kubernetes:
    targetAllocator:
      nodeSelector:
        nodeGroup: system-cpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: system-workload
kube-state-metrics:
  deployments:
    unscheduled-pods:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
    workloads:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
    networking:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
    storage:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
    configuration:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
    cluster:
      kubernetes:
        nodeSelector:
          nodeGroup: system-cpu
        tolerations:
        - key: dedicated
          operator: Equal
          value: system-workload
opentelemetry-kube-stack:
  opentelemetry-operator:
    nodeSelector:
      nodeGroup: system-cpu
    tolerations:
    - key: dedicated
      operator: Equal
      value: system-workload
  extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: nktp-scale-operator-apiserver
      namespace: '{{ .Release.Namespace }}'
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller-manager
          app.kubernetes.io/name: opentelemetry-operator
      policyTypes:
      - Egress
      egress:
      - to:
        - ipBlock:
            cidr: 172.20.0.1/32
        ports:
        - protocol: TCP
          port: 443
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: nktp-scale-targetallocator-apiserver
      namespace: '{{ .Release.Namespace }}'
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/component: opentelemetry-targetallocator
        matchExpressions:
        - key: app.kubernetes.io/instance
          operator: In
          values:
          - '{{ .Release.Namespace }}.nktp-daemonset'
          - '{{ .Release.Namespace }}.nktp-large-target-metrics'
          - '{{ .Release.Namespace }}.nktp-watchdog'
      policyTypes:
      - Egress
      egress:
      - to:
        - ipBlock:
            cidr: 172.20.0.1/32
        ports:
        - protocol: TCP
          port: 443
  - apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: nktp-100m-node
      namespace: '{{ .Release.Namespace }}'
    spec:
      selector:
        matchLabels:
          scale.nktp.io/workload: avalanche-100m
        matchExpressions:
        - key: scale.nktp.io/bucket
          operator: In
          values:
          - 1k
          - 10k
          - 40k
      podMetricsEndpoints:
      - port: metrics
        path: /metrics
        interval: 60s
        relabelings:
        - sourceLabels:
          - __meta_kubernetes_pod_name
          targetLabel: instance
        - sourceLabels:
          - __meta_kubernetes_pod_name
          targetLabel: generator_instance
        - sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: scale_node
        - sourceLabels:
          - __meta_kubernetes_pod_label_scale_nktp_io_run_id
          targetLabel: test_run_id
        - sourceLabels:
          - __meta_kubernetes_pod_label_scale_nktp_io_bucket
          targetLabel: scale_bucket
        - targetLabel: scale_scraper_pool
          replacement: node
        scrapeTimeout: 10s
  - apiVersion: monitoring.coreos.com/v1
    kind: PodMonitor
    metadata:
      name: nktp-100m-large
      namespace: '{{ .Release.Namespace }}'
      labels:
        nktp.nvidia.io/large-target: 'true'
    spec:
      selector:
        matchLabels:
          scale.nktp.io/workload: avalanche-100m
        matchExpressions:
        - key: scale.nktp.io/bucket
          operator: In
          values:
          - 150k
          - 300k
          - 600k
      podMetricsEndpoints:
      - port: metrics
        path: /metrics
        interval: 60s
        relabelings:
        - sourceLabels:
          - __meta_kubernetes_pod_name
          targetLabel: instance
        - sourceLabels:
          - __meta_kubernetes_pod_name
          targetLabel: generator_instance
        - sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: scale_node
        - sourceLabels:
          - __meta_kubernetes_pod_label_scale_nktp_io_run_id
          targetLabel: test_run_id
        - sourceLabels:
          - __meta_kubernetes_pod_label_scale_nktp_io_bucket
          targetLabel: scale_bucket
        - targetLabel: scale_scraper_pool
          replacement: large
        scrapeTimeout: 55s
  - apiVersion: opentelemetry.io/v1beta1
    kind: OpenTelemetryCollector
    metadata:
      name: nktp-scale-blackhole
      namespace: '{{ .Release.Namespace }}'
      labels:
        helm.sh/chart: '{{ include "opentelemetry-kube-stack.chart" . }}'
    spec:
      image: otel/opentelemetry-collector-k8s:0.159.0
      mode: deployment
      terminationGracePeriodSeconds: 60
      managementState: managed
      upgradeStrategy: automatic
      replicas: 4
      nodeSelector:
        nodeGroup: system-cpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: system-workload
      resources:
        requests:
          cpu: '8'
          memory: 8Gi
        limits:
          cpu: '16'
          memory: 16Gi
      env:
      - name: GOMEMLIMIT
        value: 14GiB
      - name: GOGC
        value: '50'
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-scale-blackhole-collector
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80
            spike_limit_percentage: 25
        exporters:
          nop: {}
          otlp_http/observations:
            endpoint: http://lgtm:4318
            retry_on_failure:
              max_elapsed_time: 30m
            sending_queue:
              sizer: bytes
              queue_size: 67108864
              num_consumers: 8
              block_on_overflow: true
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
        service:
          extensions:
          - health_check
          telemetry:
            resource:
              service.name: nktp-scale-blackhole
            metrics:
              readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://nktp-watchdog-collector:4318
            logs:
              processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://nktp-watchdog-collector:4318
            traces:
              processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://nktp-watchdog-collector:4318
          pipelines:
            metrics:
              receivers:
              - otlp
              processors:
              - memory_limiter
              exporters:
              - routing/observations
            metrics/blackhole:
              receivers:
              - routing/observations
              exporters:
              - nop
            metrics/observations:
              receivers:
              - routing/observations
              exporters:
              - otlp_http/observations
        connectors:
          routing/observations:
            error_mode: propagate
            default_pipelines:
            - metrics/blackhole
            table:
            - context: metric
              condition: IsMatch(metric.name, "^(up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling|container_cpu_usage_seconds_total|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_memory_working_set_bytes|kube_pod_info|kube_pod_status_phase|kube_pod_status_ready|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_node_info|kube_node_status_condition|kube_node_status_allocatable|kube_horizontalpodautoscaler_.+)$")
              action: copy
              pipelines:
              - metrics/observations
