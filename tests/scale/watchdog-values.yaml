# Watchdog throughput test with an independent sink for synthetic logs.
# This profile supplies LGTM with explicit placement and resource budgets below.
otel-lgtm:
  enabled: false
opentelemetry-kube-stack:
  extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nktp-watchdog-load
      namespace: '{{ .Release.Namespace }}'
    data:
      log-body: '{{ repeat 102400 "x" }}'
  # Discard synthetic logs without making LGTM storage the throughput limit.
  - apiVersion: opentelemetry.io/v1beta1
    kind: OpenTelemetryCollector
    metadata:
      name: nktp-watchdog-blackhole
      namespace: '{{ .Release.Namespace }}'
      labels:
        helm.sh/chart: '{{ include "opentelemetry-kube-stack.chart" . }}'
    spec:
      image: otel/opentelemetry-collector-k8s:0.159.0
      mode: deployment
      replicas: 4
      nodeSelector:
        nodeGroup: system-cpu
      tolerations:
      - key: dedicated
        operator: Equal
        value: system-workload
      resources:
        requests:
          cpu: '16'
          memory: 8Gi
        limits:
          cpu: '32'
          memory: 16Gi
      env:
      - name: GOMEMLIMIT
        value: 14GiB
      - name: GOGC
        value: '50'
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nktp-watchdog-blackhole-collector
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      config:
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 0.0.0.0:4318
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_percentage: 80
            spike_limit_percentage: 25
        exporters:
          nop: {}
        service:
          extensions:
          - health_check
          telemetry:
            resource:
              service.name: nktp-watchdog-blackhole
              service.instance.id: ${env:POD_NAME}
            metrics:
              readers:
              - periodic:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://lgtm:4318
            logs:
              processors:
              - batch:
                  exporter:
                    otlp:
                      protocol: http/protobuf
                      endpoint: http://lgtm:4318
          pipelines:
            logs:
              receivers:
              - otlp
              processors:
              - memory_limiter
              exporters:
              - nop
  # Backend configuration and capacity used in the watchdog experiment.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nktp-watchdog-lgtm-config
      namespace: '{{ .Release.Namespace }}'
    data:
      loki-config.yaml: |
        auth_enabled: false
        server:
          http_listen_port: 3100
        common:
          instance_addr: 127.0.0.1
          path_prefix: /data/loki
          storage:
            filesystem:
              chunks_directory: /data/loki/chunks
              rules_directory: /data/loki/rules
          replication_factor: 1
          ring:
            kvstore:
              store: inmemory
        schema_config:
          configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
        ruler:
          alertmanager_url: http://127.0.0.1:9093
        pattern_ingester:
          lifecycler:
            min_ready_duration: 1s
        ingester:
          lifecycler:
            min_ready_duration: 1s
        frontend:
          scheduler_dns_lookup_period: 1s
          address: 127.0.0.1
        query_scheduler:
          use_scheduler_ring: false
        limits_config:
          ingestion_rate_mb: 65536
          ingestion_burst_size_mb: 64
          per_stream_rate_limit: 64GB
          per_stream_rate_limit_burst: 64MB
      otelcol-config.yaml: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
                cors:
                  allowed_origins:
                  - http://*
          prometheus/collector:
            config:
              scrape_configs:
              - job_name: opentelemetry-collector
                scrape_interval: 1s
                static_configs:
                - targets:
                  - 127.0.0.1:8888
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
            path: /ready
        processors:
          memory_limiter:
            check_interval: 500ms
            limit_mib: 32768
            spike_limit_mib: 8192
        exporters:
          otlp_http/metrics:
            endpoint: http://127.0.0.1:9090/api/v1/otlp
            tls:
              insecure: true
            sending_queue:
              sizer: bytes
              queue_size: 67108864
              block_on_overflow: true
              num_consumers: 32
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
          otlp_http/traces:
            endpoint: http://127.0.0.1:4418
            tls:
              insecure: true
            sending_queue:
              sizer: bytes
              queue_size: 67108864
              block_on_overflow: true
              num_consumers: 32
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
          otlp_http/logs:
            endpoint: http://127.0.0.1:3100/otlp
            tls:
              insecure: true
            sending_queue:
              sizer: bytes
              queue_size: 67108864
              block_on_overflow: true
              num_consumers: 32
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
          otlp_grpc/profiles:
            endpoint: http://127.0.0.1:4040
            tls:
              insecure: true
            sending_queue:
              sizer: bytes
              queue_size: 67108864
              block_on_overflow: true
              num_consumers: 32
              batch:
                sizer: bytes
                min_size: 1048576
                max_size: 2097152
                flush_timeout: 1s
        service:
          extensions:
          - health_check
          pipelines:
            traces:
              receivers:
              - otlp
              processors:
              - memory_limiter
              exporters:
              - otlp_http/traces
            metrics:
              receivers:
              - otlp
              - prometheus/collector
              processors:
              - memory_limiter
              exporters:
              - otlp_http/metrics
            logs:
              receivers:
              - otlp
              processors:
              - memory_limiter
              exporters:
              - otlp_http/logs
            profiles:
              receivers:
              - otlp
              exporters:
              - otlp_grpc/profiles
              processors:
              - memory_limiter
  - apiVersion: v1
    kind: Service
    metadata:
      name: lgtm
      namespace: '{{ .Release.Namespace }}'
    spec:
      ports:
      - name: prometheus
        port: 9090
        targetPort: 9090
      - name: grafana
        port: 3000
        targetPort: 3000
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
      - name: otlp-http
        port: 4318
        targetPort: 4318
      selector:
        app: lgtm
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: lgtm
      namespace: '{{ .Release.Namespace }}'
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: lgtm
      template:
        metadata:
          labels:
            app: lgtm
        spec:
          containers:
          - env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: PROMETHEUS_EXTRA_ARGS
              value: --enable-feature=otlp-deltatocumulative
            - name: ENABLE_LOGS_OTELCOL
              value: 'true'
            - name: ENABLE_LOGS_LOKI
              value: 'true'
            image: grafana/otel-lgtm:0.32.0
            name: lgtm
            readinessProbe:
              exec:
                command:
                - cat
                - /tmp/ready
            resources:
              limits:
                cpu: '48'
                memory: 96Gi
              requests:
                cpu: '48'
                memory: 96Gi
            volumeMounts:
            - mountPath: /data/tempo
              name: tempo
            - mountPath: /data/grafana
              name: grafana
            - mountPath: /data/loki
              name: loki
            - mountPath: /loki
              name: loki-storage
            - mountPath: /data/prometheus
              name: prometheus
            - mountPath: /data/pyroscope
              name: pyroscope
            - mountPath: /otel-lgtm/otelcol-config.yaml
              name: watchdog-test-config
              readOnly: true
              subPath: otelcol-config.yaml
            - mountPath: /otel-lgtm/loki-config.yaml
              name: watchdog-test-config
              readOnly: true
              subPath: loki-config.yaml
          nodeSelector:
            nodeGroup: system-cpu
          tolerations:
          - key: dedicated
            operator: Equal
            value: system-workload
          volumes:
          - emptyDir: {}
            name: tempo
          - emptyDir: {}
            name: grafana
          - emptyDir: {}
            name: loki
          - emptyDir: {}
            name: loki-storage
          - emptyDir: {}
            name: prometheus
          - emptyDir: {}
            name: pyroscope
          - configMap:
              name: nktp-watchdog-lgtm-config
            name: watchdog-test-config
watchdog:
  otelcol:
    config:
      connectors:
        routing/scale_logs:
          default_pipelines:
          - logs/lgtm
          table:
          - condition: resource.attributes["service.name"] == "nktp-watchdog-load-node"
            pipelines:
            - logs/scale_blackhole
          error_mode: propagate
      exporters:
        otlp_http/scale_blackhole:
          endpoint: http://nktp-watchdog-blackhole-collector:4318
          retry_on_failure:
            max_elapsed_time: 30m
          sending_queue:
            batch:
              flush_timeout: 1s
              max_size: 2097152
              min_size: 1048576
              sizer: bytes
            block_on_overflow: true
            num_consumers: 32
            queue_size: 8388608
            sizer: bytes
      service:
        pipelines:
          logs:
            exporters:
            - routing/scale_logs
          logs/lgtm:
            receivers:
            - routing/scale_logs
            exporters:
            - otlp_http
          logs/scale_blackhole:
            receivers:
            - routing/scale_logs
            exporters:
            - otlp_http/scale_blackhole
