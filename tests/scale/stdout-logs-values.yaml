# Vector stdout log profile for the existing EKS test cluster.
# NKTP resource requests and limits use chart defaults.
# Test logs end at blackhole. Metrics and watchdog telemetry remain in LGTM.
watchdog:
  kubernetes:
    nodeSelector: &systemSelector
      nodeGroup: system-cpu
    tolerations: &systemTolerations
      - key: dedicated
        operator: Equal
        value: system-workload
    targetAllocator: &allocatorPlacement
      nodeSelector: *systemSelector
      tolerations: *systemTolerations

daemonset:
  kubernetes:
    targetAllocator: *allocatorPlacement

gateway_logs:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      exporters:
        otlp_http:
          endpoint: http://nktp-stdout-logs-blackhole-collector:4318

gateway_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations

gateway_traces:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations

large_target_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
    targetAllocator: *allocatorPlacement

cluster_events:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[scale.nktp.io/run-id,scale.nktp.io/bucket]
  deployments:
    unscheduled-pods:
      kubernetes: &systemPlacement
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
    workloads:
      kubernetes: *systemPlacement
    networking:
      kubernetes: *systemPlacement
    storage:
      kubernetes: *systemPlacement
    configuration:
      kubernetes: *systemPlacement
    cluster:
      kubernetes: *systemPlacement

# Configure the bundled LGTM backend for this test.
otel-lgtm:
  enabled: true
  resources:
    requests: {cpu: "8", memory: 16Gi}
    limits: {cpu: "16", memory: 32Gi}
  nodeSelector: *systemSelector
  tolerations: *systemTolerations

opentelemetry-kube-stack:
  opentelemetry-operator:
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
        recreate: false
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  extraObjects:
    # Preserve operator policies and permit discovery through this EKS API service.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: nktp-stdout-logs-api-access
        namespace: '{{ .Release.Namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-operator
            app.kubernetes.io/component: controller-manager
        policyTypes: [Egress]
        egress: &apiEgress
          - to:
              - ipBlock:
                  cidr: 172.20.0.1/32
            ports:
              - {protocol: TCP, port: 443}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: nktp-stdout-logs-allocator-api-access
        namespace: '{{ .Release.Namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/component: opentelemetry-targetallocator
        policyTypes: [Egress]
        egress: *apiEgress

    # Accept and discard test logs so backend storage does not limit the test.
    - apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: nktp-stdout-logs-blackhole
        labels:
          helm.sh/chart: '{{ include "opentelemetry-kube-stack.chart" . }}'
        namespace: '{{ .Release.Namespace }}'
      spec:
        image: otel/opentelemetry-collector-k8s:0.162.0
        mode: deployment
        replicas: 4
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
        resources:
          requests: {cpu: "4", memory: 4Gi}
          limits: {cpu: "16", memory: 16Gi}
        env:
          - {name: GOMEMLIMIT, value: 14GiB}
          - {name: GOGC, value: "50"}
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nktp-stdout-logs-blackhole-collector
        config:
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 500ms
              limit_percentage: 80
              spike_limit_percentage: 25
          exporters:
            nop: {}
          service:
            extensions: [health_check]
            telemetry:
              resource:
                service.name: nktp-stdout-logs-blackhole
                service.instance.id: ${env:POD_NAME}
              metrics:
                readers:
                  - periodic:
                      exporter:
                        otlp:
                          protocol: http/protobuf
                          endpoint: http://nktp-watchdog-collector:4318
              logs:
                processors:
                  - batch:
                      exporter:
                        otlp:
                          protocol: http/protobuf
                          endpoint: http://nktp-watchdog-collector:4318
            pipelines:
              logs:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [nop]

    # Observation counters use the node-local scrape pool at the default interval.
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: nktp-stdout-logs
        namespace: '{{ .Release.Namespace }}'
      spec:
        selector:
          matchLabels:
            scale.nktp.io/workload: stdout-logs-design
        podMetricsEndpoints:
          - port: metrics
            interval: 30s
            scrapeTimeout: 10s
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_name]
                targetLabel: instance
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: scale_node
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_run_id]
                targetLabel: test_run_id
              - sourceLabels: [__meta_kubernetes_pod_label_scale_nktp_io_bucket]
                targetLabel: scale_bucket
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-stdout-logs-small
        namespace: '{{ .Release.Namespace }}'
      data:
        vector.yaml: |
          sources:
            load:
              type: demo_logs
              format: shuffle
              sequence: false
              # 4 baseline records/s × 4 design multiplier = 16 records/s, interval = 1/16 s.
              interval: 0.0625
              lines: ['{{ repeat 100 "x" }}']
            self:
              type: internal_metrics
              scrape_interval_secs: 15
          transforms:
            measured:
              type: filter
              inputs: [self]
              condition: >-
                .tags.component_id == "stdout_load" &&
                includes(["component_sent_events_total", "component_sent_bytes_total"], .name)
          sinks:
            stdout_load:
              type: console
              inputs: [load]
              target: stdout
              encoding: {codec: text}
            metrics:
              type: prometheus_exporter
              inputs: [measured]
              address: 0.0.0.0:9598
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-stdout-logs-large
        namespace: '{{ .Release.Namespace }}'
      data:
        vector.yaml: |
          sources:
            load:
              type: demo_logs
              format: shuffle
              sequence: false
              # 1 baseline record/s × 4 design multiplier = 4 records/s, interval = 1/4 s.
              interval: 0.25
              lines: ['{{ repeat 65536 "x" }}']
            self:
              type: internal_metrics
              scrape_interval_secs: 15
          transforms:
            measured:
              type: filter
              inputs: [self]
              condition: >-
                .tags.component_id == "stdout_load" &&
                includes(["component_sent_events_total", "component_sent_bytes_total"], .name)
          sinks:
            stdout_load:
              type: console
              inputs: [load]
              target: stdout
              encoding: {codec: text}
            metrics:
              type: prometheus_exporter
              inputs: [measured]
              address: 0.0.0.0:9598
