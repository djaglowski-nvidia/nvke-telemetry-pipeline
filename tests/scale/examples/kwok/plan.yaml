name: kwok
timeout: 6m
stages:
  - name: emulation
    generators:
      - name: nodes
        type: kubernetes
        spec:
          duration: 3m
          nodeGroups:
            - name: workers
              replicas: 2
              nodeTemplate:
                metadata:
                  labels:
                    run_id: '{{ .Args.runId }}'
                status:
                  capacity:
                    cpu: '4'
                    memory: 8Gi
                    pods: '30'
      - name: pods
        type: pod
        spec:
          count: 20
          podTemplate:
            metadata:
              namespace: default
              labels:
                run_id: '{{ .Args.runId }}'
                scale.nktp.io/lifecycle: complete-30s
            spec:
              restartPolicy: Never
              nodeSelector:
                run_id: '{{ .Args.runId }}'
              tolerations:
                - key: kwok.x-k8s.io/node
                  operator: Equal
                  value: fake
                  effect: NoSchedule
              containers:
                - name: load
                  image: registry.k8s.io/pause:3.10
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
