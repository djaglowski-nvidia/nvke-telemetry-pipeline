version: '3'

vars:
  HELM_VALUES_FILE: '{{.HELM_VALUES_FILE | default ""}}'

tasks:
  up:
    desc: Create or reuse the scale test Kind cluster and deploy KWOK and NKTP
    deps: [check-local-deps]
    preconditions:
      - sh: test -f kind-config.yaml
        msg: 'Kind config file not found: tests/scale/kind-config.yaml'
      - sh: '{{if .HELM_VALUES_FILE}}test -f {{.HELM_VALUES_FILE | shellQuote}}{{else}}true{{end}}'
        msg: 'Helm values file not found (paths are relative to tests/scale/)'
      - sh: docker info >/dev/null 2>&1
        msg: 'Docker daemon is not running. Start it and retry.'
      - sh: test -z {{.CLI_ARGS | shellQuote}}
        msg: 'Use HELM_VALUES_FILE=<file> to supply Helm values.'
    silent: true
    cmds:
      - defer: |
          {{if .EXIT_CODE}}
          echo "Scale setup failed. Inspect the output and retry task scale:up. To recreate the cluster, run task scale:down first." >&2
          {{end}}
      - task: chart:deps
      - |
        clusters=$(kind get clusters) || exit $?
        if printf '%s\n' "$clusters" | grep -Fxq -- nktp-scale; then
          echo "Cluster nktp-scale already exists. Updating NKTP from the local chart."
        else
          kind create cluster --name nktp-scale --config kind-config.yaml --kubeconfig .kubeconfig || exit $?
        fi
      - kind export kubeconfig --name nktp-scale --kubeconfig .kubeconfig
      # Emulated Nodes may need KWOK to recover; wait only for real Kind nodes here.
      - |
        nodes=$(kind get nodes --name nktp-scale) || exit $?
        test -n "$nodes" || { echo "No Kind nodes found." >&2; exit 1; }
        kubectl --kubeconfig .kubeconfig --context kind-nktp-scale wait --for=condition=Ready nodes $nodes --timeout=5m
      - task: kwok:install
      - helm upgrade --install nktp ../../nktp --reset-values --namespace nktp --create-namespace --kubeconfig .kubeconfig --kube-context kind-nktp-scale --wait --timeout 5m {{if .HELM_VALUES_FILE}}--values {{.HELM_VALUES_FILE | shellQuote}}{{end}}
      - task: wait-ready
      - task: prometheus:up
      - 'echo "NKTP is ready. Kubeconfig: $(pwd)/.kubeconfig"'

  down:
    desc: Stop Prometheus forwarding and delete the scale test Kind cluster
    cmds:
      - task: prometheus:down
      - kind delete cluster --name nktp-scale --kubeconfig .kubeconfig
      - rm -f .kubeconfig

  kwok:install:
    internal: true
    vars:
      # Preserve the separate Stage patch with Helm 3 and Helm 4.
      HELM_STAGE_APPLY_FLAGS:
        sh: |
          case "$(helm version --short)" in
            v4.*) echo --server-side=false ;;
          esac
    cmds:
      - helm upgrade --install kwok https://github.com/kubernetes-sigs/kwok/releases/download/v0.8.0/kwok-chart-0.3.0.tgz --reset-values --namespace kube-system --kubeconfig .kubeconfig --kube-context kind-nktp-scale --wait --timeout 5m
      - helm upgrade --install kwok-stage-fast https://github.com/kubernetes-sigs/kwok/releases/download/v0.8.0/kwok-stage-fast-chart-0.3.0.tgz {{.HELM_STAGE_APPLY_FLAGS}} --reset-values --namespace kube-system --kubeconfig .kubeconfig --kube-context kind-nktp-scale --wait --timeout 5m
      - kubectl --kubeconfig .kubeconfig --context kind-nktp-scale patch stage pod-complete --type=merge --patch-file kwok/stages/pod-complete-selector-patch.yaml
      - kubectl --kubeconfig .kubeconfig --context kind-nktp-scale apply -f kwok/stages/pod-complete-30s.yaml

  prometheus:up:
    internal: true
    silent: true
    cmds:
      - task: prometheus:down
      - |
        sh -c 'nohup kubectl --kubeconfig "$(pwd)/.kubeconfig" --context kind-nktp-scale --namespace nktp port-forward --address 127.0.0.1 service/lgtm 9090:9090 > .prometheus-port-forward.log 2>&1 < /dev/null & echo $! > .prometheus-port-forward.pid'
        pid=$(cat .prometheus-port-forward.pid)
        for attempt in $(seq 1 50); do
          if ! /bin/kill -0 "$pid" 2>/dev/null; then
            break
          fi
          if grep -q 'Forwarding from 127.0.0.1:9090' .prometheus-port-forward.log; then
            echo "Prometheus is available at http://127.0.0.1:9090"
            exit 0
          fi
          sleep 0.1
        done
        /bin/kill "$pid" 2>/dev/null || true
        rm -f .prometheus-port-forward.pid
        cat .prometheus-port-forward.log >&2
        echo "Prometheus port-forward failed to start. Ensure local port 9090 is available and retry task scale:up." >&2
        exit 1

  prometheus:down:
    internal: true
    silent: true
    cmds:
      - |
        if test -f .prometheus-port-forward.pid; then
          pid=$(cat .prometheus-port-forward.pid)
          case "$pid" in
            ''|*[!0-9]*) echo "Invalid Prometheus port-forward PID." >&2; exit 1 ;;
          esac
          command=$(ps -p "$pid" -o command= 2>/dev/null || true)
          case "$command" in
            *"kubectl --kubeconfig $(pwd)/.kubeconfig --context kind-nktp-scale --namespace nktp port-forward --address 127.0.0.1 service/lgtm 9090:9090")
              /bin/kill "$pid" 2>/dev/null || true
              for attempt in $(seq 1 50); do
                if ! /bin/kill -0 "$pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if /bin/kill -0 "$pid" 2>/dev/null; then
                echo "Prometheus port-forward did not stop. Retry task scale:down." >&2
                exit 1
              fi
              ;;
          esac
        fi
        rm -f .prometheus-port-forward.pid .prometheus-port-forward.log

  chart:deps:
    internal: true
    silent: true
    cmds:
      - |
        dependencies_ready() {
          dependencies=$(helm dependency list ../../nktp --max-col-width 0) || exit $?
          # Helm can report missing or wrong versions with exit code zero.
          printf '%s\n' "$dependencies" | awk -F '\t' '
            /^[[:space:]]*$/ { next }
            { for (i = 1; i <= NF; i++) gsub(/^[[:space:]]+|[[:space:]]+$/, "", $i) }
            NR == 1 && NF == 4 && $1 == "NAME" && $2 == "VERSION" && $3 == "REPOSITORY" && $4 == "STATUS" { header = 1; next }
            !header || NF != 4 || $1 == "" || $2 == "" || $4 == "" { malformed = 1; next }
            { rows++; if ($4 != "ok" && $4 != "unpacked") unhealthy = 1 }
            END { if (malformed || !rows) exit 2; exit unhealthy }
          '
        }
        dependency_status=0
        dependencies_ready || dependency_status=$?
        case "$dependency_status" in
          0) exit 0 ;;
          1) ;;
          *) echo "Unexpected Helm dependency list output." >&2; exit "$dependency_status" ;;
        esac
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update || exit $?
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update || exit $?
        helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ --force-update || exit $?
        helm dependency build ../../nktp --skip-refresh || exit $?
        dependencies_ready || { echo "Chart dependencies are not ready after building." >&2; exit 1; }

  wait-ready:
    internal: true
    silent: true
    cmds:
      # Helm does not wait for workloads created later by the Operator.
      - |
        kubectl_scale() {
          kubectl --kubeconfig .kubeconfig --context kind-nktp-scale --namespace nktp "$@"
        }
        collectors=$(kubectl_scale get opentelemetrycollectors -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.mode}{" "}{.spec.targetAllocator.enabled}{"\n"}{end}') || exit $?
        test -n "$collectors" || { echo "No NKTP collectors found in namespace nktp." >&2; exit 1; }
        while read -r name mode allocator; do
          case "$mode" in
            deployment|statefulset|daemonset)
              kubectl_scale wait --for=create "$mode/$name-collector" --timeout=5m || exit $?
              ;;
            sidecar) ;;
            *) echo "Unsupported collector mode: $mode" >&2; exit 1 ;;
          esac
          if [ "$allocator" = true ]; then
            kubectl_scale wait --for=create "deployment/$name-targetallocator" --timeout=5m || exit $?
          fi
        done <<EOF
        $collectors
        EOF
        workloads=$(kubectl_scale get deployment,statefulset,daemonset -o name) || exit $?
        test -n "$workloads" || { echo "No NKTP workloads found in namespace nktp." >&2; exit 1; }
        kubectl_scale rollout status $workloads --timeout=5m

  check-local-deps:
    internal: true
    silent: true
    cmds:
      - |
        missing=0
        for tool in docker kind kubectl helm; do
          command -v "$tool" >/dev/null || { echo "missing: $tool"; missing=1; }
        done
        exit $missing
