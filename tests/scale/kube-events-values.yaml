# Kubernetes Event profile for the existing EKS test cluster.
# NKTP resource requests and limits use chart defaults.
# Test logs end at blackhole. Metrics and watchdog telemetry remain in LGTM.
watchdog:
  kubernetes:
    nodeSelector: &systemSelector
      nodeGroup: system-cpu
    tolerations: &systemTolerations
      - key: dedicated
        operator: Equal
        value: system-workload
    targetAllocator: &allocatorPlacement
      nodeSelector: *systemSelector
      tolerations: *systemTolerations

daemonset:
  kubernetes:
    targetAllocator: *allocatorPlacement

gateway_logs:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      exporters:
        otlp:
          endpoint: nktp-kube-events-blackhole-collector:4317

gateway_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations

gateway_traces:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations

large_target_metrics:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
    targetAllocator: *allocatorPlacement

cluster_events:
  kubernetes:
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  otelcol:
    config:
      receivers:
        k8s_events:
          dedup_interval: 0s

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[scale.nktp.io/run-id]
  deployments:
    unscheduled-pods:
      kubernetes: &systemPlacement
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
    workloads:
      kubernetes: *systemPlacement
    networking:
      kubernetes: *systemPlacement
    storage:
      kubernetes: *systemPlacement
    configuration:
      kubernetes: *systemPlacement
    cluster:
      kubernetes: *systemPlacement

# Configure the bundled LGTM backend for this test.
otel-lgtm:
  enabled: true
  resources:
    requests: {cpu: "8", memory: 16Gi}
    limits: {cpu: "16", memory: 32Gi}
  nodeSelector: *systemSelector
  tolerations: *systemTolerations

opentelemetry-kube-stack:
  opentelemetry-operator:
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
        recreate: false
    nodeSelector: *systemSelector
    tolerations: *systemTolerations
  extraObjects:
    # Preserve operator policies and permit discovery through this EKS API service.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: nktp-kube-events-api-access
        namespace: '{{ .Release.Namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-operator
            app.kubernetes.io/component: controller-manager
        policyTypes: [Egress]
        egress: &apiEgress
          - to:
              - ipBlock:
                  cidr: 172.20.0.1/32
            ports:
              - {protocol: TCP, port: 443}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: nktp-kube-events-allocator-api-access
        namespace: '{{ .Release.Namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/component: opentelemetry-targetallocator
        policyTypes: [Egress]
        egress: *apiEgress

    # Accept and discard test logs so backend storage does not limit the test.
    - apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      metadata:
        name: nktp-kube-events-blackhole
        labels:
          helm.sh/chart: '{{ include "opentelemetry-kube-stack.chart" . }}'
        namespace: '{{ .Release.Namespace }}'
      spec:
        image: otel/opentelemetry-collector-k8s:0.159.0
        mode: deployment
        replicas: 4
        nodeSelector: *systemSelector
        tolerations: *systemTolerations
        resources:
          requests: {cpu: "4", memory: 4Gi}
          limits: {cpu: "16", memory: 16Gi}
        env:
          - {name: GOMEMLIMIT, value: 14GiB}
          - {name: GOGC, value: "50"}
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeAffinityPolicy: Honor
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: nktp-kube-events-blackhole-collector
        config:
          extensions:
            health_check:
              endpoint: 0.0.0.0:13133
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 500ms
              limit_percentage: 80
              spike_limit_percentage: 25
          exporters:
            nop: {}
          service:
            extensions: [health_check]
            telemetry:
              resource:
                service.name: nktp-kube-events-blackhole
              metrics:
                readers:
                  - periodic:
                      exporter:
                        otlp:
                          # The SDK uses http:// below to select plaintext gRPC.
                          protocol: grpc
                          endpoint: http://nktp-watchdog-collector:4317
              logs:
                processors:
                  - batch:
                      exporter:
                        otlp:
                          protocol: grpc
                          endpoint: http://nktp-watchdog-collector:4317
            pipelines:
              logs:
                receivers: [otlp]
                processors: [memory_limiter]
                exporters: [nop]

    # Generators create, patch and clean up Events in the release namespace.
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: nktp-kube-events
        namespace: '{{ .Release.Namespace }}'
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: nktp-kube-events
        namespace: '{{ .Release.Namespace }}'
      rules:
        - apiGroups: [""]
          resources: [events]
          verbs: [create, patch, delete]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: nktp-kube-events
        namespace: '{{ .Release.Namespace }}'
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: nktp-kube-events
      subjects:
        - kind: ServiceAccount
          name: nktp-kube-events
          namespace: '{{ .Release.Namespace }}'
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: nktp-kube-events
        namespace: '{{ .Release.Namespace }}'
      data:
        events.js: |
          import http from 'k6/http';
          import exec from 'k6/execution';
          import { sleep } from 'k6';
          import { Counter } from 'k6/metrics';

          const count = 100; // 100 Events × 100 producers = 10,000 retained objects.
          const api = 'https://kubernetes.default.svc/api/v1/namespaces/' + __ENV.POD_NAMESPACE + '/events';
          const token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').trim();
          const owner = { apiVersion: 'v1', kind: 'Pod', name: __ENV.POD_NAME, uid: __ENV.POD_UID };
          const successes = new Counter('event_patch_success');
          const failures = new Counter('event_patch_failures');
          // Zero samples keep the built-in dropped-iteration counter observable even without drops.
          const dropped = new Counter('dropped_iterations');

          export const options = {
            scenarios: {
              events: {
                executor: 'constant-arrival-rate',
                rate: 100, timeUnit: '1s', // 10,000 updates/s / 100 producers = 100 PATCHes/s.
                duration: '2m', // 100/s × 120s × 100 producers = 1.2 million updates.
                preAllocatedVUs: 64, maxVUs: 512, // Allow up to 100/s × 5s concurrent requests.
                gracefulStop: '10s',
              },
            },
            setupTimeout: '2m', teardownTimeout: '2m',
            batch: 10, batchPerHost: 10,
            systemTags: ['method', 'status', 'name'],
            tags: { test_run_id: __ENV.EVENT_RUN_ID, scale_node: __ENV.NODE_NAME, producer_id: __ENV.POD_UID },
            thresholds: {
              http_req_failed: ['rate==0'],
              dropped_iterations: ['count==0'],
            },
          };

          function name(i) { return 'nktp-event-' + __ENV.POD_UID + '-' + i; }
          function params(operation, statuses) {
            return {
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': operation === 'patch' ? 'application/merge-patch+json' : 'application/json' },
              timeout: '5s', tags: { name: 'event-' + operation },
              responseType: operation === 'create' ? 'text' : 'none',
              responseCallback: http.expectedStatuses(...statuses),
            };
          }

          const patchParams = params('patch', [200]);

          export function setup() {
            const created = [];
            try {
              for (let i = 0; i < count; i++) {
                const timestamp = new Date().toISOString();
                const event = {
                  apiVersion: 'v1', kind: 'Event',
                  metadata: {
                    name: name(i), namespace: __ENV.POD_NAMESPACE, ownerReferences: [owner],
                    labels: { 'scale.nktp.io/workload': 'kube-events', 'scale.nktp.io/run-id': __ENV.EVENT_RUN_ID, 'scale.nktp.io/producer-id': __ENV.POD_UID },
                  },
                  involvedObject: { ...owner, namespace: __ENV.POD_NAMESPACE },
                  reason: 'NKTPScaleTest', type: 'Normal', action: 'Scale',
                  reportingComponent: 'nktp.nvidia.io/scale-test', reportingInstance: __ENV.EVENT_RUN_ID,
                  message: 'x'.repeat(1024), source: { component: 'k6', host: __ENV.NODE_NAME },
                  firstTimestamp: timestamp, lastTimestamp: timestamp, count: 1,
                };
                const response = http.post(api, JSON.stringify(event), params('create', [201]));
                if (response.status !== 201) throw new Error('Event seed failed: HTTP ' + response.status);
                created.push({ name: name(i), uid: response.json('metadata.uid') });
                sleep(0.1); // Seed at no more than 10 creates/s per producer.
              }
            } catch (error) {
              teardown(created); // k6 does not invoke teardown after a failed setup.
              throw error;
            }
            return created;
          }

          export default function () {
            const iteration = exec.scenario.iterationInTest;
            // Cycle through 100 names, advancing each Event count once per second.
            const patch = { count: Math.floor(iteration / count) + 2, lastTimestamp: new Date().toISOString() };
            const response = http.patch(api + '/' + name(iteration % count), JSON.stringify(patch), patchParams);
            successes.add(response.status === 200 ? 1 : 0);
            failures.add(response.status === 200 ? 0 : 1);
            dropped.add(0);
          }

          export function teardown(created) {
            const requests = created.map(event => {
              const body = JSON.stringify({ apiVersion: 'v1', kind: 'DeleteOptions', preconditions: { uid: event.uid } });
              return ['DELETE', api + '/' + event.name, body, params('delete', [200, 202, 404])];
            });
            const failed = http.batch(requests).filter(r => ![200, 202, 404].includes(r.status)).length;
            if (failed) throw new Error(failed + ' Event deletes failed, Pod ownership provides GC fallback');
          }
