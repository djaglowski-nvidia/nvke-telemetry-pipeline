# The default DaemonSet collectors discover this monitor through their allocator.
opentelemetry-kube-stack:
  extraObjects:
    - apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: nktp-scale-avalanche
        namespace: nktp
      spec:
        selector:
          matchLabels:
            scale.nktp.io/workload: avalanche
        podMetricsEndpoints:
          - path: /metrics
            interval: 15s
            # Job containers need no declared port when discovery supplies the address.
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_ip]
                regex: '(.+)'
                targetLabel: __address__
                replacement: '${1}:9001'
              - sourceLabels: [__meta_kubernetes_pod_ip]
                regex: '(.+:.*)'
                targetLabel: __address__
                replacement: '[${1}]:9001'
