apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nktp-e2e-kubelet-metrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nktp-e2e-kubelet-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nktp-e2e-kubelet-metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory
          image: ghcr.io/nvidia/topograph:v0.4.0@sha256:f227bf161464da4a23273a535914c98b33d26e5bf24bdf7f50159ab4b875b717
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep", "3600"]
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
