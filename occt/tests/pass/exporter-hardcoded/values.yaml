# An exporter blueprint can be used like a native exporter.
# A reference to a exporter blueprint is automatically scoped.
# References to components and pipelines declared within a exporter blueprint are automatically scoped.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]

config:
  receivers:
    some_receiver: {}
  exporters:
    blueprint/my_exporter/a: {}
  service:
    pipelines:
      logs:
        receivers: [some_receiver]
        exporters: [blueprint/my_exporter/a]
