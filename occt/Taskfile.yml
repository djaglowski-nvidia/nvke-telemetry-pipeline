version: "3"

tasks:
  test:
    desc: Run OCCT test suite
    dir: tests
    cmds:
      - go test ./... {{.CLI_ARGS}}
  update:
    desc: Regenerate OCCT test suite snapshot files
    dir: tests
    cmds:
      - go test -update ./...
