# An receiver blueprint can declare a processor in its internal pipeline.
# The processor is automatically scoped like the receiver component.
blueprints:
  receivers:
    my_receiver:
      template: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317

        processors:
          batch: {}

        pipelines:
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [{{ .forward }}]

receivers:
  blueprint/my_receiver: {}
exporters:
  some_exporter: {}
service:
  pipelines:
    logs:
      receivers: [blueprint/my_receiver]
      exporters: [some_exporter]
