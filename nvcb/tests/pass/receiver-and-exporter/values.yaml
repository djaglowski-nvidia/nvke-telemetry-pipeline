# A receiver blueprint and an exporter blueprint can be used in the same pipeline.
blueprints:
  receivers:
    my_receiver:
      template: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317

        pipelines:
          logs:
            receivers: [otlp]
            exporters: [{{ .forward }}]

  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]

receivers:
  blueprint/my_receiver: {}
exporters:
  blueprint/my_exporter: {}
service:
  pipelines:
    logs:
      receivers: [blueprint/my_receiver]
      exporters: [blueprint/my_exporter]
