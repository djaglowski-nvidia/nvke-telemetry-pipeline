---
# Source: test-chart/templates/run.yaml
connectors:
  forward/exp/my_exporter: {}
  forward/rcv/my_receiver: {}
exporters:
  debug/exp/my_exporter:
    verbosity: detailed
receivers:
  otlp/rcv/my_receiver:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
service:
  pipelines:
    logs:
      exporters:
      - forward/exp/my_exporter
      receivers:
      - forward/rcv/my_receiver
    logs/exp/my_exporter:
      exporters:
      - debug/exp/my_exporter
      receivers:
      - forward/exp/my_exporter
    logs/rcv/my_receiver:
      exporters:
      - forward/rcv/my_receiver
      receivers:
      - otlp/rcv/my_receiver
