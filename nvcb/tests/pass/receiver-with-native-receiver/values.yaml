# A receiver blueprint can be listed alongside a native receiver in the same pipeline.
blueprints:
  receivers:
    my_receiver:
      template: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317

        pipelines:
          logs:
            receivers: [otlp]
            exporters: [{{ .forward }}]

receivers:
  some_receiver: {}
  blueprint/my_receiver: {}
exporters:
  some_exporter: {}
service:
  pipelines:
    logs:
      receivers: [blueprint/my_receiver, some_receiver]
      exporters: [some_exporter]
