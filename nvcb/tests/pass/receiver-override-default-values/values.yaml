# A receiver blueprint declaration can override the templates's default values.
blueprints:
  receivers:
    my_receiver:
      template: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: {{ .values.endpoint | default "0.0.0.0:4317" }}

        pipelines:
          logs:
            receivers: [otlp]
            exporters: [{{ .forward }}]

config:
  receivers:
    blueprint/my_receiver:
      endpoint: 0.0.0.0:4318
  exporters:
    some_exporter: {}
  service:
    pipelines:
      logs:
        receivers: [blueprint/my_receiver]
        exporters: [some_exporter]
