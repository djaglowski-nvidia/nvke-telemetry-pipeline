# Blueprint instance names can contain slashes.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]

receivers:
  some_receiver: {}
exporters:
  blueprint/my_exporter/foo/bar: {}
service:
  pipelines:
    logs:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter/foo/bar]
