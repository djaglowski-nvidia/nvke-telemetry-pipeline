# Two instances of the same blueprint receive different parameter values.
# Both are used in the same pipeline, with independently scoped components.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          otlp:
            endpoint: {{ .values.endpoint | quote }}

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [otlp]

receivers:
  some_receiver: {}
exporters:
  blueprint/my_exporter/a:
    endpoint: collector-a.example.com:4317
  blueprint/my_exporter/b:
    endpoint: collector-b.example.com:4317
service:
  pipelines:
    logs:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter/a, blueprint/my_exporter/b]
