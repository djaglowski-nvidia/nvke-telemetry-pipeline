    endpoint: collector-a.example.com:4317
  otlp/(exp/my_exporter/b):
    endpoint: collector-b.example.com:4317
receivers:
  some_receiver: {}
service:
  pipelines:
    logs:
      exporters:
      - forward/exp/my_exporter/a
      - forward/exp/my_exporter/b
      receivers:
      - some_receiver
