connectors:
  forward/exp/my_exporter: {}
exporters:
  debug/exp/my_exporter:
    verbosity: detailed
receivers:
  some_receiver: {}
  some_receiver/audit: {}
service:
  pipelines:
    logs:
      exporters:
      - forward/exp/my_exporter
      receivers:
      - some_receiver
