---
# Source: test-chart/templates/run.yaml
connectors:
  forward/rcv/my_receiver: {}
exporters:
  some_exporter: {}
extensions:
  file_storage/(rcv/my_receiver):
    directory: /var/lib/otelcol
receivers:
  filelog/(rcv/my_receiver):
    include:
    - /var/log/*.log
    storage: file_storage/(rcv/my_receiver)
service:
  extensions:
  - file_storage/(rcv/my_receiver)
  pipelines:
    logs:
      exporters:
      - some_exporter
      receivers:
      - forward/rcv/my_receiver
    logs/(rcv/my_receiver):
      exporters:
      - forward/rcv/my_receiver
      receivers:
      - filelog/(rcv/my_receiver)
