# An exporter blueprint receives parameters from its declaration without defaults.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          otlp:
            endpoint: {{ .values.endpoint | required "my_exporter: endpoint is required" | quote }}

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [otlp]

receivers:
  some_receiver: {}
exporters:
  blueprint/my_exporter:
    endpoint: collector.example.com:4317
service:
  pipelines:
    logs:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter]
