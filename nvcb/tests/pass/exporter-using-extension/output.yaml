---
# Source: test-chart/templates/run.yaml
connectors:
  forward/exp/my_exporter: {}
exporters:
  otlp/exp/my_exporter:
    endpoint: collector.example.com:4317
    sending_queue:
      storage: file_storage/exp/my_exporter
extensions:
  file_storage/exp/my_exporter:
    directory: /var/lib/otelcol
receivers:
  some_receiver: {}
service:
  extensions:
  - file_storage/exp/my_exporter
  pipelines:
    logs:
      exporters:
      - forward/exp/my_exporter
      receivers:
      - some_receiver
    logs/exp/my_exporter:
      exporters:
      - otlp/exp/my_exporter
      receivers:
      - forward/exp/my_exporter
