# An exporter blueprint can expose multiple signals.
# The blueprint must be used in one or more pipelines of each corresponding signal
# All pipeline IDs are automatically scoped.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]
          metrics:
            receivers: [{{ .forward }}]
            exporters: [debug]

receivers:
  some_receiver: {}
exporters:
  blueprint/my_exporter: {}
service:
  pipelines:
    logs:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter]
    metrics:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter]
