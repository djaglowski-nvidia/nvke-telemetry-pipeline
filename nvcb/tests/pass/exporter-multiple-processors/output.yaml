---
# Source: test-chart/templates/run.yaml
connectors:
  forward/exp/my_exporter: {}
exporters:
  debug/(exp/my_exporter):
    verbosity: detailed
processors:
  batch/(exp/my_exporter): {}
  memory_limiter/(exp/my_exporter):
    check_interval: 1s
    limit_mib: 512
receivers:
  some_receiver: {}
service:
  pipelines:
    logs:
      exporters:
      - forward/exp/my_exporter
      receivers:
      - some_receiver
    logs/(exp/my_exporter):
      exporters:
      - debug/(exp/my_exporter)
      processors:
      - memory_limiter/(exp/my_exporter)
      - batch/(exp/my_exporter)
      receivers:
      - forward/exp/my_exporter
