# An exporter blueprint cannot be used as a connector between host pipelines.
# Its declaration is valid, but referencing it as a receiver is not.
blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]

config:
  receivers:
    some_receiver: {}
  exporters:
    blueprint/my_exporter/a: {}
    some_exporter: {}
  service:
    pipelines:
      logs/ingest:
        receivers: [some_receiver]
        exporters: [blueprint/my_exporter/a]
      logs/egress:
        receivers: [blueprint/my_exporter/a]
        exporters: [some_exporter]
