# service.extensions must be a list.

blueprints:
  exporters:
    my_exporter:
      template: |
        exporters:
          debug:
            verbosity: detailed

        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [debug]

receivers:
  some_receiver: {}
exporters:
  blueprint/my_exporter: {}
  some_exporter: {}
service:
  extensions:
    not:
      a:
        list: {}
  pipelines:
    logs:
      receivers: [some_receiver]
      exporters: [blueprint/my_exporter]
