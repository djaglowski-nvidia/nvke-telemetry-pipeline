# Nested processor references are rejected even without a matching body declaration.
blueprints:
  receivers:
    source:
      template: |
        receivers:
          otlp: {}
        pipelines:
          logs:
            receivers: [otlp]
            processors: [blueprint/batch]
            exporters: [{{ .forward }}]
receivers:
  blueprint/source: {}
exporters:
  debug: {}
service:
  pipelines:
    logs:
      receivers: [blueprint/source]
      exporters: [debug]
