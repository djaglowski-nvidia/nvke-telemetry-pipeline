# A blueprint's pipelines.exporters must be a list, not an empty map.
blueprints:
  receivers:
    source:
      template: |
        receivers:
          otlp: {}
        processors:
          batch: {}
        pipelines:
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: {}
receivers:
  blueprint/source: {}
exporters:
  debug: {}
service:
  pipelines:
    logs:
      receivers: [blueprint/source]
      exporters: [debug]
