# A blueprint pipeline cannot reference another blueprint as an exporter.
blueprints:
  exporters:
    sink:
      template: |
        pipelines:
          logs:
            receivers: [{{ .forward }}]
            exporters: [blueprint/inner]
receivers:
  otlp: {}
exporters:
  blueprint/sink: {}
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [blueprint/sink]
