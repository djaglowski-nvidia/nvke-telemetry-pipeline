# A blueprint cannot reach Helm's release context.
blueprints:
  receivers:
    release_aware:
      template: |
        receivers:
          foo_receiver:
            release: {{ .Release.Name }}

        pipelines:
          logs:
            receivers: [foo_receiver]
            exporters: [{{ .forward }}]

config:
  receivers:
    blueprint/release_aware/a: {}
  exporters:
    some_exporter: {}
  service:
    pipelines:
      logs:
        receivers: [blueprint/release_aware/a]
        exporters: [some_exporter]
