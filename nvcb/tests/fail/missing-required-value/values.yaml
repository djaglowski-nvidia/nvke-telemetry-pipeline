# A required parameter with no default and no declared value is rejected.
blueprints:
  receivers:
    my_source:
      template: |
        receivers:
          foo_receiver:
            endpoint: {{ required "nvcb: blueprint/my_source/a: endpoint is required" .values.endpoint | quote }}

        pipelines:
          logs:
            receivers: [foo_receiver]
            exporters: [{{ .forward }}]

config:
  receivers:
    blueprint/my_source/a: {}
  exporters:
    some_exporter: {}
  service:
    pipelines:
      logs:
        receivers: [blueprint/my_source/a]
        exporters: [some_exporter]
