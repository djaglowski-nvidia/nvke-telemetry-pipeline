apiVersion: v2
name: test-chart
description: |
  Consumer chart used only to test NVCB. NVCB is a library
  chart and emits nothing on its own, so something has to call it and render the
  result; this is that caller, standing in for a real consuming chart.
type: application
version: 0.0.0
dependencies:
  - name: nvcb
    version: "0.1.0"
    repository: "file://../../chart"
